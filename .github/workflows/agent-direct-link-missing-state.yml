name: Stage direct-link missing-state patch

on:
  push:
    branches:
      - agent/direct-link-missing-state

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/direct-link-missing-state

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply scoped patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          # Preserve AllDebrid error codes structurally so callers can distinguish
          # a permanently missing hoster file from temporary/provider failures.
          replace_once(
              'backend/services/alldebrid.py',
              'TIMEOUT = aiohttp.ClientTimeout(total=30)\n\n\nclass AllDebridService:',
              '''TIMEOUT = aiohttp.ClientTimeout(total=30)\n\n\nclass AllDebridAPIError(Exception):\n    """AllDebrid API failure with a machine-readable provider error code."""\n\n    def __init__(self, code: str, message: str):\n        self.code = str(code or "UNKNOWN")\n        self.message = str(message or "")\n        super().__init__(f"AllDebrid [{self.code}]: {self.message}")\n\n\nclass AllDebridService:''',
          )
          replace_once(
              'backend/services/alldebrid.py',
              '''                    raise Exception(f"AllDebrid [{code}]: {msg}")\n                return result.get("data", {})''',
              '''                    raise AllDebridAPIError(code, msg)\n                return result.get("data", {})''',
          )

          # Direct-link preparation: do not retry LINK_DOWN, mark only that code
          # as missing, retain the submitted filename, and expose a useful reason.
          replace_once(
              'backend/services/manager_v2.py',
              'from services.alldebrid import AllDebridService, flatten_files',
              'from services.alldebrid import AllDebridAPIError, AllDebridService, flatten_files',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''async def _retry_async(fn, *args, attempts: int = MAX_FILE_RETRIES, delay: float = 1.0):\n    last_error = None\n    for attempt in range(1, attempts + 1):\n        try:\n            return await fn(*args)\n        except Exception as exc:\n            last_error = exc\n            if attempt >= attempts:\n                break\n            await asyncio.sleep(delay * attempt)\n    raise last_error''',
              '''async def _retry_async(\n    fn, *args, attempts: int = MAX_FILE_RETRIES, delay: float = 1.0, retry_if=None\n):\n    last_error = None\n    for attempt in range(1, attempts + 1):\n        try:\n            return await fn(*args)\n        except Exception as exc:\n            last_error = exc\n            if retry_if is not None and not retry_if(exc):\n                break\n            if attempt >= attempts:\n                break\n            await asyncio.sleep(delay * attempt)\n    raise last_error''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''                        generated = await _retry_async(\n                            self.ad().unlock_link,\n                            row["source_url"],\n                        )''',
              '''                        generated = await _retry_async(\n                            self.ad().unlock_link,\n                            row["source_url"],\n                            retry_if=lambda exc: not (\n                                isinstance(exc, AllDebridAPIError)\n                                and exc.code == "LINK_DOWN"\n                            ),\n                        )''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''                            "size_bytes": max(0, size_bytes),\n                            "error": None,\n                        }\n                    except Exception as exc:\n                        return {\n                            **row,\n                            "generated_url": "",\n                            "filename": direct_link_filename(\n                                row["source_url"], row["index"]\n                            ),\n                            "size_bytes": 0,\n                            "error": sanitize_exception(exc, max_length=500),\n                        }''',
              '''                            "size_bytes": max(0, size_bytes),\n                            "error": None,\n                            "missing": False,\n                        }\n                    except Exception as exc:\n                        return {\n                            **row,\n                            "generated_url": "",\n                            "filename": direct_link_filename(\n                                row["source_url"], row["index"]\n                            ),\n                            "size_bytes": 0,\n                            "error": sanitize_exception(exc, max_length=500),\n                            "missing": (\n                                isinstance(exc, AllDebridAPIError)\n                                and exc.code == "LINK_DOWN"\n                            ),\n                        }''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''            succeeded = 0\n            failed = 0\n            total_size = 0''',
              '''            succeeded = 0\n            failed = 0\n            missing = 0\n            total_size = 0''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''                if result["error"]:\n                    failed += 1\n                    async with get_db() as db:\n                        await db.execute(\n                            """UPDATE download_files\n                               SET status='error', block_reason=?,\n                                   updated_at=CURRENT_TIMESTAMP\n                               WHERE id=?""",\n                            (result["error"], result["file_id"]),\n                        )\n                        await db.execute(\n                            "INSERT INTO events (torrent_id, level, message) VALUES (?, 'error', ?)",\n                            (\n                                torrent_id,\n                                f"AllDebrid could not generate link {position}: {result['error']}",\n                            ),\n                        )\n                        await db.commit()''',
              '''                if result["error"]:\n                    failed += 1\n                    is_missing = bool(result.get("missing"))\n                    if is_missing:\n                        missing += 1\n                    failure_status = "missing" if is_missing else "error"\n                    failure_reason = (\n                        "File is no longer available on the source host"\n                        if is_missing\n                        else result["error"]\n                    )\n                    async with get_db() as db:\n                        await db.execute(\n                            """UPDATE download_files\n                               SET status=?, block_reason=?,\n                                   updated_at=CURRENT_TIMESTAMP\n                               WHERE id=?""",\n                            (failure_status, failure_reason, result["file_id"]),\n                        )\n                        await db.execute(\n                            "INSERT INTO events (torrent_id, level, message) VALUES (?, 'error', ?)",\n                            (\n                                torrent_id,\n                                f"AllDebrid could not generate link {position}: {failure_reason}",\n                            ),\n                        )\n                        await db.commit()''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''            if len(normalized) == 1 and resolved_names:\n                final_name = resolved_names[0]\n            else:\n                final_name = f"Debrid link batch ({len(normalized)} links)"''',
              '''            if len(normalized) == 1:\n                final_name = (\n                    resolved_names[0]\n                    if resolved_names\n                    else direct_link_filename(normalized[0], 1)\n                )\n            else:\n                final_name = f"Debrid link batch ({len(normalized)} links)"''',
          )
          replace_once(
              'backend/services/manager_v2.py',
              '''            else:\n                message = "All submitted links failed during AllDebrid generation"\n                async with get_db() as db:\n                    await db.execute(\n                        """UPDATE torrents\n                           SET name=?, status='error', provider_status='error',\n                               error_message=?, progress=0,\n                               updated_at=CURRENT_TIMESTAMP\n                           WHERE id=?""",\n                        (final_name, message, torrent_id),''',
              '''            else:\n                all_missing = failed > 0 and missing == failed\n                message = (\n                    "File is no longer available on the source host"\n                    if all_missing and len(normalized) == 1\n                    else (\n                        f"{missing} submitted files are no longer available on their source hosts"\n                        if all_missing\n                        else "All submitted links failed during AllDebrid generation"\n                    )\n                )\n                provider_status = "missing" if all_missing else "error"\n                async with get_db() as db:\n                    await db.execute(\n                        """UPDATE torrents\n                           SET name=?, status='error', provider_status=?,\n                               error_message=?, progress=0,\n                               updated_at=CURRENT_TIMESTAMP\n                           WHERE id=?""",\n                        (final_name, provider_status, message, torrent_id),''',
          )

          # UI: keep the lifecycle status as error internally, but render a
          # direct-link LINK_DOWN parent and its file rows as "Missing file".
          replace_once(
              'frontend/static/app.js',
              '''function badge(s) {\n  const m = {pending:'⏳ Pending',uploading:'⬆ Uploading',processing:'⚙ Processing',\n    queued:'🕓 Queued',paused:'⏸ Paused',downloading:'⬇ Downloading',ready:'✓ Ready',completed:'✅ Done',\n    error:'❌ Error',deleted:'🗑 Deleted',imported:'📋 Imported',partial:'⚠ Partial'};\n  return `<span class="badge badge-${s}">${m[s]||s}</span>`;\n}\nfunction progress(pct, status) {''',
              '''function badge(s) {\n  const m = {pending:'⏳ Pending',uploading:'⬆ Uploading',processing:'⚙ Processing',\n    queued:'🕓 Queued',paused:'⏸ Paused',downloading:'⬇ Downloading',ready:'✓ Ready',completed:'✅ Done',\n    error:'❌ Error',missing:'❌ Missing file',deleted:'🗑 Deleted',imported:'📋 Imported',partial:'⚠ Partial'};\n  const cls = s === 'missing' ? 'error' : s;\n  return `<span class="badge badge-${cls}">${m[s]||s}</span>`;\n}\nfunction transferDisplayStatus(t) {\n  if (t && t.source === 'direct_link' && t.status === 'error' && t.provider_status === 'missing') {\n    return 'missing';\n  }\n  return (t && t.status) || '';\n}\nfunction progress(pct, status) {''',
          )
          replace_all(
              'frontend/static/app.js',
              'badge(t.status)',
              'badge(transferDisplayStatus(t))',
              minimum=3,
          )
          replace_once(
              'frontend/static/app.js',
              '''                ${f.blocked?`<span class="badge badge-error" style="font-size:9px;margin-left:6px">BLOCKED: ${esc(f.block_reason)}</span>`:''}\n              </td>''',
              '''                ${f.blocked\n                  ? `<span class="badge badge-error" style="font-size:9px;margin-left:6px">BLOCKED: ${esc(f.block_reason)}</span>`\n                  : (f.block_reason ? `<div style="font-size:10px;color:var(--red);margin-top:4px">${esc(f.block_reason)}</div>` : '')}\n              </td>''',
          )

          # Focused regression coverage.
          replace_once(
              'backend/tests/test_direct_links.py',
              'from services.alldebrid import AllDebridService',
              'from services.alldebrid import AllDebridAPIError, AllDebridService',
          )
          replace_once(
              'backend/tests/test_direct_links.py',
              '''    TorrentManager,\n    direct_link_filename,\n    normalize_direct_links,\n)''',
              '''    TorrentManager,\n    _retry_async,\n    direct_link_filename,\n    normalize_direct_links,\n)''',
          )
          replace_once(
              'backend/tests/test_direct_links.py',
              '''class DirectLinkTransactionTests(unittest.IsolatedAsyncioTestCase):''',
              '''class MissingDirectLinkTests(unittest.IsolatedAsyncioTestCase):\n    async def test_link_down_keeps_code_and_is_not_retried(self):\n        calls = 0\n\n        async def missing_link():\n            nonlocal calls\n            calls += 1\n            raise AllDebridAPIError(\n                "LINK_DOWN",\n                "This link is not available on the file hoster website",\n            )\n\n        with self.assertRaises(AllDebridAPIError) as caught:\n            await _retry_async(\n                missing_link,\n                attempts=3,\n                retry_if=lambda exc: not (\n                    isinstance(exc, AllDebridAPIError)\n                    and exc.code == "LINK_DOWN"\n                ),\n            )\n\n        self.assertEqual(calls, 1)\n        self.assertEqual(caught.exception.code, "LINK_DOWN")\n        self.assertIn("LINK_DOWN", str(caught.exception))\n\n\nclass DirectLinkTransactionTests(unittest.IsolatedAsyncioTestCase):''',
          )
          replace_once(
              'backend/tests/test_direct_links.py',
              '''        self.assertIn("function sourceLabel(source)", js)''',
              '''        self.assertIn("function sourceLabel(source)", js)\n        self.assertIn("function transferDisplayStatus(t)", js)\n        self.assertIn("missing:'❌ Missing file'", js)\n        self.assertIn("File is no longer available on the source host", (repo_root / "backend/services/manager_v2.py").read_text())''',
          )
          PY

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run focused direct-link tests
        run: |
          cd backend
          python -m pytest tests/test_direct_links.py -v --tb=short

      - name: Syntax-check changed Python
        run: |
          cd backend
          python -m py_compile services/alldebrid.py services/manager_v2.py tests/test_direct_links.py

      - name: Commit staged patch and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-direct-link-missing-state.yml
          git add backend/services/alldebrid.py backend/services/manager_v2.py backend/tests/test_direct_links.py frontend/static/app.js
          git diff --cached --check
          git commit -m "Handle missing direct-link files"
          git push origin HEAD:agent/direct-link-missing-state
