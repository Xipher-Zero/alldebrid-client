name: Apply v1.0.5 Audit Corrections

on:
  push:
    branches: ['work/v1.0.5-architecture']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/work/v1.0.5-architecture' || github.event.pull_request.head.ref == 'work/v1.0.5-architecture'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.5-architecture
          fetch-depth: 0

      - name: Apply correction script once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/v105_audit_corrections.py ]; then
            echo 'Correction script already consumed; nothing to do.'
            exit 0
          fi
          python tools/v105_audit_corrections.py
          # Workflow files are updated separately via the GitHub API so this
          # Actions token never needs to push a workflow-file mutation.
          git checkout -- .github/workflows/tests.yml
          git rm tools/v105_audit_corrections.py

      - name: Commit reachable corrected source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/core/scheduler.py \
            backend/services/notification_service.py \
            backend/services/notifications.py \
            backend/services/aria2_gateway.py \
            backend/db/database.py \
            backend/services/transfer_control_service.py \
            backend/services/transfer_service.py \
            backend/services/db_maintenance.py \
            backend/services/backup.py \
            backend/api/routes.py \
            backend/main.py \
            README.md \
            index.html \
            backend/tests/test_v105_audit_regressions.py \
            tools/v105_audit_corrections.py
          git commit -m 'Fix v1.0.5 audit findings and add regressions'
          git push origin HEAD:work/v1.0.5-architecture
