name: Temporary audit-loop correction v3

on:
  pull_request:
    branches:
      - 'staging/**'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'work/v1.0.6-auth-overhaul'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-auth-overhaul
          fetch-depth: 0

      - name: Apply remaining transition parity corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "backend/auth/transitions.py",
              '''        value = payload[field]\n        # Blank secret input preserves the stored secret unless an explicit\n        # clear flag is present, matching the normal settings-write contract.\n        if field == "oidc_client_secret" and not str(value or "").strip():\n            continue\n        setattr(candidate, field, value)\n''',
              '''        value = payload[field]\n        if field in {"auth_oidc_enabled", "oidc_allow_all"}:\n            value = _coerced_bool(\n                value,\n                default=bool(getattr(current, field, False)),\n            )\n        # Blank secret input preserves the stored secret unless an explicit\n        # clear flag is present, matching the normal settings-write contract.\n        if field == "oidc_client_secret" and not str(value or "").strip():\n            continue\n        setattr(candidate, field, value)\n''',
          )
          replace(
              "backend/auth/transitions.py",
              '''        if payload.get("confirm_open_mode") is not True:\n''',
              '''        if not _coerced_bool(payload.get("confirm_open_mode", False)):\n''',
          )

          test_path = Path("backend/tests/test_auth_third_audit.py")
          tests = test_path.read_text(encoding="utf-8")
          tests += '''\n\n@pytest.mark.asyncio\nasync def test_transition_guard_matches_pydantic_true_string_for_open_mode_confirmation():\n    body = json.dumps({\n        "auth_password_enabled": "false",\n        "auth_oidc_enabled": "false",\n        "confirm_open_mode": "true",\n    }).encode()\n    parsed = AuthenticationConfigUpdate.model_validate_json(body)\n    assert parsed.confirm_open_mode is True\n    rejection = await transitions.settings_transition_rejection(\n        _request(body),\n        Principal.password_session("operator"),\n        _password_only_settings(),\n    )\n    assert rejection is None\n\n\ndef test_prospective_oidc_readiness_does_not_treat_false_string_as_allow_all():\n    current = SimpleNamespace(\n        auth_oidc_enabled=False,\n        oidc_provider_name="OIDC",\n        oidc_issuer_url="https://id.example/application/o/debridpulse/",\n        oidc_client_id="client",\n        oidc_client_secret="",\n        oidc_scopes=["openid", "email"],\n        public_base_url="https://pulse.example",\n        oidc_allow_all=False,\n        oidc_allowed_subjects=[],\n        oidc_allowed_emails=[],\n        oidc_allowed_groups=[],\n        oidc_group_claim="groups",\n    )\n    payload = {\n        "auth_oidc_enabled": "true",\n        "oidc_allow_all": "false",\n    }\n    assert transitions._prospective_oidc_ready(payload, current) is False\n'''
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/audit-loop-correction-v3.yml").unlink(missing_ok=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Validate corrected working tree
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit corrected tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Align transition guard boolean semantics"
          git push origin HEAD:work/v1.0.6-auth-overhaul
