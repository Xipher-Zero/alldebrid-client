name: Temporary audit-loop correction v6

on:
  pull_request:
    branches:
      - 'staging/**'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'work/v1.0.6-auth-overhaul'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-auth-overhaul
          fetch-depth: 0

      - name: Bind local password proofs to current configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:140]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Shared exact-current proof check for both browser Password sessions
          # and one-shot HTTP Basic request admission.
          replace(
              "backend/auth/manager.py",
              "from auth.passwords import basic_verification_cache, verify_password_candidate_async\n",
              "from auth.passwords import basic_verification_cache, password_credential_version, verify_password_candidate_async\n",
          )
          replace(
              "backend/auth/manager.py",
              '''def peer_key(request: Request) -> str:\n    \"\"\"Use the transport peer, not untrusted forwarding headers, for throttling.\"\"\"\n    client = request.client\n    return str(client.host if client else "unknown")\n\n\nasync def verify_local_credentials(\n''',
              '''def peer_key(request: Request) -> str:\n    \"\"\"Use the transport peer, not untrusted forwarding headers, for throttling.\"\"\"\n    client = request.client\n    return str(client.host if client else "unknown")\n\n\ndef password_authentication_snapshot_current(proven, current) -> bool:\n    \"\"\"Return whether a completed password proof still matches live auth state.\"\"\"\n    if not password_auth_ready(current):\n        return False\n    proven_username = str(getattr(proven, "auth_username", "") or "").strip()\n    current_username = str(getattr(current, "auth_username", "") or "").strip()\n    if not proven_username or proven_username != current_username:\n        return False\n    proven_version = password_credential_version(getattr(proven, "auth_password_hash", ""))\n    current_version = password_credential_version(getattr(current, "auth_password_hash", ""))\n    return bool(\n        proven_version\n        and current_version\n        and secrets.compare_digest(proven_version, current_version)\n    )\n\n\nasync def verify_local_credentials(\n''',
          )

          # HTTP Basic: expensive verification can yield while a password update
          # commits. Recheck under the same auth-config lock used by writers and
          # linearize admission only if the proof snapshot is still current.
          replace(
              "backend/auth/middleware.py",
              "from auth.manager import PasswordAuthenticationBusy, verify_local_credentials\n",
              "from auth.manager import (\n    PasswordAuthenticationBusy,\n    password_authentication_snapshot_current,\n    verify_local_credentials,\n)\n",
          )
          old_basic = '''            if await verify_local_credentials(\n                request,\n                provided_user,\n                provided_pass,\n                allow_basic_success_cache=True,\n                settings=cfg,\n            ):\n                username = str(getattr(cfg, "auth_username", "") or "").strip()\n                principal = Principal.http_basic(username)\n                _attach_principal(request, principal)\n                return await _admit_authenticated(request, call_next, principal, cfg)\n            return _unauthorized(basic_challenge=True)\n'''
          new_basic = '''            if await verify_local_credentials(\n                request,\n                provided_user,\n                provided_pass,\n                allow_basic_success_cache=True,\n                settings=cfg,\n            ):\n                if is_auth_settings_mutation(request):\n                    # Production reaches this branch with the configuration lock\n                    # already held by enforce_authentication(). Avoid re-entering\n                    # the non-reentrant asyncio.Lock.\n                    current = get_settings()\n                    if not password_authentication_snapshot_current(cfg, current):\n                        return _unauthorized(basic_challenge=True)\n                    username = str(getattr(current, "auth_username", "") or "").strip()\n                    principal = Principal.http_basic(username)\n                    _attach_principal(request, principal)\n                    return await _admit_authenticated(request, call_next, principal, current)\n\n                async with authentication_configuration_lock:\n                    current = get_settings()\n                    if not password_authentication_snapshot_current(cfg, current):\n                        return _unauthorized(basic_challenge=True)\n                    username = str(getattr(current, "auth_username", "") or "").strip()\n                    principal = Principal.http_basic(username)\n                    _attach_principal(request, principal)\n                return await _admit_authenticated(request, call_next, principal, current)\n            return _unauthorized(basic_challenge=True)\n'''
          replace("backend/auth/middleware.py", old_basic, new_basic)

          # Browser Password login: bind session creation to the same exact
          # username/hash/enabled state that was actually verified. Creating the
          # session while holding the writer lock also guarantees a subsequent
          # password update will see and revoke it.
          replace(
              "backend/api/auth_routes.py",
              "from auth.manager import PasswordAuthenticationBusy, peer_key, verify_local_credentials\n",
              "from auth.manager import (\n    PasswordAuthenticationBusy,\n    password_authentication_snapshot_current,\n    peer_key,\n    verify_local_credentials,\n)\n",
          )
          old_login = '''    old_token = session_cookie_token(request)\n    if old_token:\n        session_store.revoke(old_token)\n\n    configured_username = str(getattr(cfg, "auth_username", "") or "").strip()\n    lifetime = _session_lifetime_seconds(cfg)\n    version = password_credential_version(getattr(cfg, "auth_password_hash", ""))\n    token, _record = session_store.create(\n        Principal.password_session(configured_username, credential_version=version),\n        lifetime_seconds=lifetime,\n        credential_version=version,\n    )\n'''
          new_login = '''    async with authentication_configuration_lock:\n        current = get_settings()\n        if not password_authentication_snapshot_current(cfg, current):\n            return _issue_login_page(\n                request,\n                return_to=return_to,\n                error="Authentication configuration changed while sign-in was in progress. Try again.",\n                status_code=409,\n            )\n\n        old_token = session_cookie_token(request)\n        if old_token:\n            session_store.revoke(old_token)\n\n        configured_username = str(getattr(current, "auth_username", "") or "").strip()\n        lifetime = _session_lifetime_seconds(current)\n        version = password_credential_version(getattr(current, "auth_password_hash", ""))\n        token, _record = session_store.create(\n            Principal.password_session(configured_username, credential_version=version),\n            lifetime_seconds=lifetime,\n            credential_version=version,\n        )\n'''
          replace("backend/api/auth_routes.py", old_login, new_login)

          # Behavioral regressions for stale Basic admission and stale browser
          # session issuance. These deliberately switch the authoritative config
          # while the mocked expensive verification is in flight.
          p = Path("backend/tests/test_auth_third_audit.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("import asyncio\n", "import asyncio\nimport base64\n", 1)
          text = text.replace("from fastapi import Request\n", "from fastapi import Request, Response\n", 1)
          text += '''\n\ndef _basic_header(username: str, password: str) -> str:\n    token = base64.b64encode(f"{username}:{password}".encode()).decode()\n    return f"Basic {token}"\n\n\ndef _password_cfg(password: str, *, username: str = "operator", enabled: bool = True):\n    return SimpleNamespace(\n        auth_password_enabled=enabled,\n        auth_username=username,\n        auth_password_hash=hash_password(password),\n        auth_oidc_enabled=False,\n    )\n\n\ndef _generic_request(method: str, path: str, *, headers=None, body: bytes = b""):\n    sent = False\n    raw_headers = [\n        (str(key).lower().encode("latin-1"), str(value).encode("latin-1"))\n        for key, value in (headers or {}).items()\n    ]\n\n    async def receive():\n        nonlocal sent\n        if sent:\n            return {"type": "http.request", "body": b"", "more_body": False}\n        sent = True\n        return {"type": "http.request", "body": body, "more_body": False}\n\n    return Request({\n        "type": "http", "asgi": {"version": "3.0"}, "http_version": "1.1",\n        "method": method, "scheme": "https", "path": path, "raw_path": path.encode(),\n        "query_string": b"", "headers": raw_headers,\n        "client": ("127.0.0.1", 12345), "server": ("pulse.example", 443),\n    }, receive=receive)\n\n\n@pytest.mark.asyncio\nasync def test_http_basic_rejects_password_proof_that_became_stale_during_verification(monkeypatch):\n    import auth.middleware as middleware\n\n    old = _password_cfg("old-secret")\n    new = _password_cfg("new-secret")\n    authoritative = [old]\n    monkeypatch.setattr(middleware, "get_settings", lambda: authoritative[0])\n\n    async def fake_verify(*_args, **_kwargs):\n        authoritative[0] = new\n        return True\n\n    monkeypatch.setattr(middleware, "verify_local_credentials", fake_verify)\n    called = False\n\n    async def admitted(_request):\n        nonlocal called\n        called = True\n        return Response(content="ok")\n\n    request = _generic_request(\n        "GET",\n        "/api/stats",\n        headers={"Host": "pulse.example", "Authorization": _basic_header("operator", "old-secret")},\n    )\n    response = await middleware.enforce_authentication(request, admitted)\n    assert response.status_code == 401\n    assert called is False\n    assert request.state.principal.authenticated is False\n\n\n@pytest.mark.asyncio\nasync def test_password_login_does_not_issue_session_from_stale_verified_snapshot(monkeypatch):\n    from urllib.parse import urlencode\n    from api import auth_routes\n\n    old = _password_cfg("old-secret")\n    old.auth_session_lifetime_hours = 12\n    new = _password_cfg("new-secret")\n    new.auth_session_lifetime_hours = 12\n    authoritative = [old]\n    monkeypatch.setattr(auth_routes, "get_settings", lambda: authoritative[0])\n    monkeypatch.setattr(auth_routes.login_csrf_store, "consume", lambda *_args, **_kwargs: True)\n\n    async def fake_verify(*_args, **_kwargs):\n        authoritative[0] = new\n        return True\n\n    monkeypatch.setattr(auth_routes, "verify_local_credentials", fake_verify)\n    session_store.clear()\n    form = urlencode({\n        "username": "operator",\n        "password": "old-secret",\n        "csrf_token": "valid",\n        "next": "/",\n    }).encode()\n    request = _generic_request(\n        "POST",\n        "/login",\n        headers={\n            "Host": "pulse.example",\n            "Content-Type": "application/x-www-form-urlencoded",\n            "Content-Length": str(len(form)),\n        },\n        body=form,\n    )\n    response = await auth_routes.password_login(request)\n    assert response.status_code == 409\n    assert session_store.size == 0\n'''
          p.write_text(text, encoding="utf-8")

          Path(".github/workflows/audit-loop-correction-v6.yml").unlink(missing_ok=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Validate corrected working tree
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit corrected tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Bind local password proofs to current credentials"
          git push origin HEAD:work/v1.0.6-auth-overhaul
