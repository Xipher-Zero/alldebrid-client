name: Temporary audit-loop correction v7

on:
  pull_request:
    branches:
      - 'staging/**'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'work/v1.0.6-auth-overhaul'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-auth-overhaul
          fetch-depth: 0

      - name: Add legacy settings revocation parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:140]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "backend/api/routes.py",
              "from core.version import normalize_version_tag, read_version\n",
              "from core.version import normalize_version_tag, read_version\nfrom auth.models import AuthMechanism\nfrom auth.oidc_version import oidc_configuration_version\nfrom auth.passwords import basic_verification_cache, password_credential_version\nfrom auth.sessions import session_store\n",
          )

          replace(
              "backend/api/routes.py",
              '''def _public_settings(settings: AppSettings) -> dict:\n    data = settings.model_dump()\n    for field in _SECRET_SETTINGS:\n        if field in data:\n            data[f"{field}_configured"] = bool(str(data.get(field) or "").strip())\n            data[field] = ""\n    data["database_backend"] = "sqlite"\n    data["timezone"] = (os.getenv("TZ", "UTC") or "UTC").strip() or "UTC"\n    return data\n\n\n@router.get("/settings")\n''',
              '''def _public_settings(settings: AppSettings) -> dict:\n    data = settings.model_dump()\n    for field in _SECRET_SETTINGS:\n        if field in data:\n            data[f"{field}_configured"] = bool(str(data.get(field) or "").strip())\n            data[field] = ""\n    data["database_backend"] = "sqlite"\n    data["timezone"] = (os.getenv("TZ", "UTC") or "UTC").strip() or "UTC"\n    return data\n\n\ndef _password_auth_binding(settings: AppSettings) -> tuple[bool, str, str]:\n    return (\n        bool(getattr(settings, "auth_password_enabled", False)),\n        str(getattr(settings, "auth_username", "") or "").strip(),\n        password_credential_version(getattr(settings, "auth_password_hash", "")),\n    )\n\n\ndef _oidc_auth_binding(settings: AppSettings) -> tuple[bool, str]:\n    return (\n        bool(getattr(settings, "auth_oidc_enabled", False)),\n        oidc_configuration_version(settings),\n    )\n\n\ndef _revoke_stale_authentication_state(previous: AppSettings, current: AppSettings) -> None:\n    \"\"\"Give the legacy broad Settings route the same revocation semantics as the dedicated auth route.\"\"\"\n    if _password_auth_binding(previous) != _password_auth_binding(current):\n        basic_verification_cache.clear()\n        session_store.revoke_mechanism(AuthMechanism.PASSWORD_SESSION)\n    if _oidc_auth_binding(previous) != _oidc_auth_binding(current):\n        session_store.revoke_mechanism(AuthMechanism.OIDC_SESSION)\n\n\n@router.get("/settings")\n''',
          )

          replace(
              "backend/api/routes.py",
              '''    save_settings(clean)\n    apply_settings(clean)\n    transfer_service.reset_services()\n''',
              '''    save_settings(clean)\n    apply_settings(clean)\n    _revoke_stale_authentication_state(previous, clean)\n    transfer_service.reset_services()\n''',
              count=1,
          )

          Path("backend/tests/test_auth_legacy_settings_revocation.py").write_text(
              '''from auth.models import AuthMechanism, Principal\nfrom auth.passwords import basic_verification_cache, hash_password\nfrom auth.sessions import session_store\nfrom core.config import AppSettings\n\n\ndef _settings(*, password="secret", username="operator", password_enabled=True, issuer="https://id.example/app", oidc_enabled=True):\n    return AppSettings(\n        auth_password_enabled=password_enabled,\n        auth_username=username,\n        auth_password_hash=hash_password(password),\n        auth_oidc_enabled=oidc_enabled,\n        oidc_provider_name="OIDC",\n        oidc_issuer_url=issuer,\n        oidc_client_id="client",\n        oidc_client_secret="secret",\n        oidc_scopes=["openid", "email"],\n        oidc_allow_all=True,\n        public_base_url="https://pulse.example",\n    )\n\n\ndef test_legacy_settings_password_change_clears_basic_cache_and_revokes_password_sessions():\n    from api import routes\n\n    previous = _settings(password="old-secret")\n    current = previous.model_copy(deep=True)\n    current.auth_password_hash = hash_password("new-secret")\n\n    basic_verification_cache.clear()\n    basic_verification_cache.remember("operator", "old-secret", previous.auth_password_hash)\n    session_store.clear()\n    token, _ = session_store.create(\n        Principal.password_session("operator"),\n        lifetime_seconds=3600,\n        credential_version=routes.password_credential_version(previous.auth_password_hash),\n    )\n    assert session_store.resolve(token) is not None\n    assert basic_verification_cache.size == 1\n\n    routes._revoke_stale_authentication_state(previous, current)\n    assert session_store.resolve(token) is None\n    assert basic_verification_cache.size == 0\n\n\ndef test_legacy_settings_oidc_change_revokes_oidc_sessions():\n    from api import routes\n\n    previous = _settings(issuer="https://id.example/app")\n    current = previous.model_copy(update={"oidc_issuer_url": "https://id.example/new-app"}, deep=True)\n    session_store.clear()\n    token, _ = session_store.create(\n        Principal.oidc_session("https://id.example/app|user-1"),\n        lifetime_seconds=3600,\n        credential_version=routes.oidc_configuration_version(previous),\n    )\n    assert session_store.resolve(token) is not None\n\n    routes._revoke_stale_authentication_state(previous, current)\n    assert session_store.resolve(token) is None\n\n\ndef test_legacy_settings_unrelated_change_does_not_revoke_auth_sessions():\n    from api import routes\n\n    previous = _settings()\n    current = previous.model_copy(update={"max_concurrent_downloads": previous.max_concurrent_downloads + 1}, deep=True)\n    session_store.clear()\n    password_token, _ = session_store.create(\n        Principal.password_session("operator"),\n        lifetime_seconds=3600,\n        credential_version=routes.password_credential_version(previous.auth_password_hash),\n    )\n    oidc_token, _ = session_store.create(\n        Principal.oidc_session("https://id.example/app|user-1"),\n        lifetime_seconds=3600,\n        credential_version=routes.oidc_configuration_version(previous),\n    )\n\n    routes._revoke_stale_authentication_state(previous, current)\n    assert session_store.resolve(password_token) is not None\n    assert session_store.resolve(oidc_token) is not None\n''',
              encoding="utf-8",
          )

          Path(".github/workflows/audit-loop-correction-v7.yml").unlink(missing_ok=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Validate corrected working tree
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit corrected tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Revoke sessions on legacy authentication updates"
          git push origin HEAD:work/v1.0.6-auth-overhaul
