name: Temporary authentication audit correction v8

on:
  pull_request:
    branches:
      - 'staging/**'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'work/v1.0.6-auth-overhaul'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-auth-overhaul
          fetch-depth: 0

      - name: Apply authentication-state audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:160]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # The legacy broad Settings endpoint is PUT-shaped but historically accepts
          # partial JSON. Its transition guard already treats omitted auth fields as
          # unchanged; make the route persistence semantics match that contract.
          replace(
              "backend/api/routes.py",
              '''_SECRET_SETTINGS = {\n    "alldebrid_api_key", "aria2_secret", "discord_webhook_url",\n    "discord_webhook_added", "stats_report_webhook_url",\n    "auth_password", "extraction_password",\n}\n''',
              '''_SECRET_SETTINGS = {\n    "alldebrid_api_key", "aria2_secret", "discord_webhook_url",\n    "discord_webhook_added", "stats_report_webhook_url",\n    "auth_password", "extraction_password",\n}\n\n# SettingsUpdate inherits AppSettings, so omitted values are otherwise populated\n# with model defaults before the route sees them. Authentication transition\n# enforcement reasons from the raw request and deliberately treats omitted auth\n# fields as unchanged. Preserve those fields here too so a partial legacy PUT\n# cannot silently reset authentication behind the transition state machine.\n_AUTH_COMPAT_SETTINGS_FIELDS = (\n    "auth_password_enabled",\n    "auth_username",\n    "auth_session_lifetime_hours",\n    "auth_oidc_enabled",\n    "oidc_provider_name",\n    "oidc_issuer_url",\n    "oidc_client_id",\n    "oidc_scopes",\n    "oidc_allow_all",\n    "oidc_allowed_subjects",\n    "oidc_allowed_emails",\n    "oidc_allowed_groups",\n    "oidc_group_claim",\n    "public_base_url",\n)\n''',
          )
          replace(
              "backend/api/routes.py",
              '''    merged = new.model_dump(exclude={"clear_secrets"})\n    for field in _SECRET_SETTINGS:\n''',
              '''    merged = new.model_dump(exclude={"clear_secrets"})\n    explicitly_set = set(new.model_fields_set)\n    for field in _AUTH_COMPAT_SETTINGS_FIELDS:\n        if field not in explicitly_set:\n            merged[field] = getattr(previous, field)\n    for field in _SECRET_SETTINGS:\n''',
          )

          # Parse Discovery as metadata rather than treating missing/malformed arrays
          # as permissive defaults. OIDC defines client_secret_basic as the default
          # only when token_endpoint_auth_methods_supported is omitted; ID-token
          # signing metadata itself is required. Also require Authorization Code
          # support because that is the only flow DebridPulse initiates.
          replace(
              "backend/auth/oidc.py",
              '''import hashlib\nimport hmac\nimport os\n''',
              '''import base64\nimport hashlib\nimport hmac\nimport json\nimport os\n''',
          )
          replace(
              "backend/auth/oidc.py",
              '''from joserfc.jwk import KeySet\n''',
              '''from joserfc.jwk import KeySet, OctKey\n''',
          )
          replace(
              "backend/auth/oidc.py",
              '''def _parse_discovery(config: OidcConfiguration, data: Mapping[str, Any]) -> OidcDiscovery:\n    discovered_issuer = str(data.get("issuer") or "").strip()\n    if not discovered_issuer or discovered_issuer != config.issuer:\n        raise OidcProtocolError("OIDC discovery issuer does not match the configured issuer")\n\n    methods = tuple(\n        str(item)\n        for item in (data.get("token_endpoint_auth_methods_supported") or [])\n        if str(item or "").strip()\n    )\n    algorithms = tuple(\n        str(item)\n        for item in (data.get("id_token_signing_alg_values_supported") or ["RS256"])\n        if str(item or "").strip() and str(item) != "none"\n    )\n    if not algorithms:\n        raise OidcProtocolError("OIDC provider advertises no usable ID-token signing algorithm")\n\n    pkce = data.get("code_challenge_methods_supported")\n    if pkce is not None and "S256" not in pkce:\n        raise OidcProtocolError("OIDC provider does not advertise PKCE S256 support")\n\n    raw_userinfo = str(data.get("userinfo_endpoint") or "").strip()\n    userinfo_endpoint = (\n        _https_endpoint(raw_userinfo, field="UserInfo endpoint")\n        if raw_userinfo\n        else ""\n    )\n\n    return OidcDiscovery(\n        issuer=config.issuer,\n        authorization_endpoint=_https_endpoint(\n            str(data.get("authorization_endpoint") or ""),\n            field="authorization endpoint",\n        ),\n        token_endpoint=_https_endpoint(\n            str(data.get("token_endpoint") or ""),\n            field="token endpoint",\n        ),\n        jwks_uri=_https_endpoint(str(data.get("jwks_uri") or ""), field="JWKS URI"),\n        token_endpoint_auth_methods=methods,\n        signing_algorithms=algorithms,\n        userinfo_endpoint=userinfo_endpoint,\n    )\n''',
              '''def _metadata_string_array(\n    data: Mapping[str, Any],\n    field: str,\n    *,\n    required: bool,\n) -> tuple[str, ...] | None:\n    raw = data.get(field)\n    if raw is None:\n        if required:\n            raise OidcProtocolError(f"OIDC discovery is missing required {field} metadata")\n        return None\n    if not isinstance(raw, list) or not raw:\n        raise OidcProtocolError(f"OIDC discovery returned invalid {field} metadata")\n    values: list[str] = []\n    for item in raw:\n        if not isinstance(item, str) or not item.strip():\n            raise OidcProtocolError(f"OIDC discovery returned invalid {field} metadata")\n        value = item.strip()\n        if value not in values:\n            values.append(value)\n    return tuple(values)\n\n\ndef _parse_discovery(config: OidcConfiguration, data: Mapping[str, Any]) -> OidcDiscovery:\n    discovered_issuer = str(data.get("issuer") or "").strip()\n    if not discovered_issuer or discovered_issuer != config.issuer:\n        raise OidcProtocolError("OIDC discovery issuer does not match the configured issuer")\n\n    authorization_endpoint = _https_endpoint(\n        str(data.get("authorization_endpoint") or ""),\n        field="authorization endpoint",\n    )\n    token_endpoint = _https_endpoint(\n        str(data.get("token_endpoint") or ""),\n        field="token endpoint",\n    )\n    jwks_uri = _https_endpoint(str(data.get("jwks_uri") or ""), field="JWKS URI")\n\n    response_types = _metadata_string_array(data, "response_types_supported", required=True)\n    if response_types is None or "code" not in response_types:\n        raise OidcProtocolError("OIDC provider does not advertise Authorization Code flow support")\n\n    pkce = _metadata_string_array(data, "code_challenge_methods_supported", required=False)\n    if pkce is not None and "S256" not in pkce:\n        raise OidcProtocolError("OIDC provider does not advertise PKCE S256 support")\n\n    methods = _metadata_string_array(\n        data,\n        "token_endpoint_auth_methods_supported",\n        required=False,\n    )\n    if methods is None:\n        # OIDC Discovery 1.0 defines this exact default when the member is omitted.\n        methods = ("client_secret_basic",)\n\n    advertised_algorithms = _metadata_string_array(\n        data,\n        "id_token_signing_alg_values_supported",\n        required=True,\n    )\n    algorithms = tuple(alg for alg in (advertised_algorithms or ()) if alg != "none")\n    if not algorithms:\n        raise OidcProtocolError("OIDC provider advertises no usable ID-token signing algorithm")\n\n    raw_userinfo = str(data.get("userinfo_endpoint") or "").strip()\n    userinfo_endpoint = (\n        _https_endpoint(raw_userinfo, field="UserInfo endpoint")\n        if raw_userinfo\n        else ""\n    )\n\n    return OidcDiscovery(\n        issuer=config.issuer,\n        authorization_endpoint=authorization_endpoint,\n        token_endpoint=token_endpoint,\n        jwks_uri=jwks_uri,\n        token_endpoint_auth_methods=methods,\n        signing_algorithms=algorithms,\n        userinfo_endpoint=userinfo_endpoint,\n    )\n''',
          )

          # OIDC Core requires MAC-signed ID tokens (HS256/384/512) to be verified
          # with the UTF-8 client_secret. This matters directly for authentik, which
          # uses symmetric signing when an OAuth provider has no Signing Key.
          replace(
              "backend/auth/oidc.py",
              '''async def validate_id_token(\n    token_response: Mapping[str, Any],\n    transaction: OidcTransaction,\n) -> Mapping[str, Any]:\n    encoded = str(token_response.get("id_token") or "")\n    if not encoded:\n        raise OidcProtocolError("OIDC token response did not include an ID token")\n    jwks = await _fetch_json(transaction.discovery.jwks_uri)\n    try:\n        key_set = KeySet.import_key_set(dict(jwks))\n        token = jwt.decode(\n            encoded,\n            key_set,\n            algorithms=list(transaction.discovery.signing_algorithms),\n        )\n        claims = CodeIDToken(\n''',
              '''def _id_token_algorithm(encoded: str) -> str:\n    try:\n        header_segment = str(encoded).split(".", 1)[0]\n        if not header_segment:\n            raise ValueError("missing JOSE header")\n        padding = "=" * (-len(header_segment) % 4)\n        header = json.loads(base64.urlsafe_b64decode(header_segment + padding))\n    except (ValueError, TypeError, json.JSONDecodeError) as exc:\n        raise OidcProtocolError("OIDC ID token header is invalid") from exc\n    if not isinstance(header, dict):\n        raise OidcProtocolError("OIDC ID token header is invalid")\n    algorithm = str(header.get("alg") or "").strip()\n    if not algorithm or algorithm == "none":\n        raise OidcProtocolError("OIDC ID token signing algorithm is invalid")\n    return algorithm\n\n\nasync def validate_id_token(\n    token_response: Mapping[str, Any],\n    transaction: OidcTransaction,\n) -> Mapping[str, Any]:\n    encoded = str(token_response.get("id_token") or "")\n    if not encoded:\n        raise OidcProtocolError("OIDC token response did not include an ID token")\n\n    algorithm = _id_token_algorithm(encoded)\n    if algorithm not in transaction.discovery.signing_algorithms:\n        raise OidcProtocolError("OIDC ID token uses an unadvertised signing algorithm")\n\n    try:\n        if algorithm.startswith("HS"):\n            if not transaction.config.client_secret:\n                raise OidcProtocolError("OIDC MAC-signed ID token requires a client secret")\n            verification_key = OctKey.import_key(\n                transaction.config.client_secret,\n                {"use": "sig"},\n            )\n        else:\n            jwks = await _fetch_json(transaction.discovery.jwks_uri)\n            verification_key = KeySet.import_key_set(dict(jwks))\n\n        token = jwt.decode(\n            encoded,\n            verification_key,\n            algorithms=[algorithm],\n        )\n        claims = CodeIDToken(\n''',
          )
          replace(
              "backend/auth/oidc.py",
              '''    if claims.get("nonce") != transaction.nonce:\n        raise OidcProtocolError("OIDC ID token nonce is invalid")\n    _validate_authorized_party(claims, transaction.config.client_id)\n    return dict(claims)\n''',
              '''    if claims.get("nonce") != transaction.nonce:\n        raise OidcProtocolError("OIDC ID token nonce is invalid")\n    _validate_authorized_party(claims, transaction.config.client_id)\n    if algorithm.startswith("HS") and not isinstance(claims.get("aud"), str):\n        # OIDC Core leaves MAC validation behavior unspecified for multi-audience\n        # ID tokens. Reject rather than attempting to infer a shared-secret party.\n        raise OidcProtocolError("OIDC MAC-signed ID token requires a single audience")\n    return dict(claims)\n''',
          )

          # Regression coverage for partial legacy PUT semantics.
          replace(
              "backend/tests/test_auth_legacy_settings_compat.py",
              '''from api.routes import SettingsUpdate, _merge_secret_settings\n''',
              '''from api.routes import (\n    SettingsUpdate,\n    _AUTH_COMPAT_SETTINGS_FIELDS,\n    _merge_secret_settings,\n)\n''',
          )
          p = Path("backend/tests/test_auth_legacy_settings_compat.py")
          text = p.read_text(encoding="utf-8")
          text += '''\n\ndef test_legacy_partial_settings_update_preserves_authentication_state():\n    previous = AppSettings(\n        auth_password_enabled=True,\n        auth_username="operator",\n        auth_session_lifetime_hours=24,\n        auth_oidc_enabled=True,\n        oidc_provider_name="Authentik",\n        oidc_issuer_url="https://id.example/application/o/debridpulse/",\n        oidc_client_id="debridpulse-client",\n        oidc_scopes=["openid", "profile"],\n        oidc_allow_all=False,\n        oidc_allowed_subjects=["https://id.example/application/o/debridpulse/|user-1"],\n        oidc_allowed_emails=[],\n        oidc_allowed_groups=["debridpulse-operators"],\n        oidc_group_claim="groups",\n        public_base_url="https://pulse.example",\n    )\n    update = SettingsUpdate(max_concurrent_downloads=7)\n\n    merged = _merge_secret_settings(update, previous)\n\n    assert merged["max_concurrent_downloads"] == 7\n    for field in _AUTH_COMPAT_SETTINGS_FIELDS:\n        assert merged[field] == getattr(previous, field)\n\n\ndef test_legacy_explicit_authentication_fields_still_override_previous_state():\n    previous = AppSettings(auth_password_enabled=True, auth_username="operator")\n    update = SettingsUpdate(auth_password_enabled=False, auth_username="replacement")\n\n    merged = _merge_secret_settings(update, previous)\n\n    assert merged["auth_password_enabled"] is False\n    assert merged["auth_username"] == "replacement"\n'''
          p.write_text(text, encoding="utf-8")

          # Discovery defaults and authentik-compatible symmetric ID-token coverage.
          replace(
              "backend/tests/test_auth_oidc.py",
              '''from joserfc.jwk import RSAKey\n''',
              '''from joserfc.jwk import OctKey, RSAKey\n''',
          )
          replace(
              "backend/tests/test_auth_oidc.py",
              '''            "code_challenge_methods_supported": ["S256"],\n            "id_token_signing_alg_values_supported": ["RS256", "none"],\n        },\n    )\n    assert valid.signing_algorithms == ("RS256",)\n''',
              '''            "response_types_supported": ["code", "id_token"],\n            "code_challenge_methods_supported": ["S256"],\n            "id_token_signing_alg_values_supported": ["RS256", "none"],\n        },\n    )\n    assert valid.signing_algorithms == ("RS256",)\n    assert valid.token_endpoint_auth_methods == ("client_secret_basic",)\n''',
          )
          replace(
              "backend/tests/test_auth_oidc.py",
              '''        "jwks_uri": cfg.issuer + "/jwks",\n        "code_challenge_methods_supported": ["plain"],\n    }\n    with pytest.raises(oidc.OidcProtocolError, match="PKCE S256"):\n        oidc._parse_discovery(cfg, no_pkce)\n''',
              '''        "jwks_uri": cfg.issuer + "/jwks",\n        "response_types_supported": ["code"],\n        "code_challenge_methods_supported": ["plain"],\n    }\n    with pytest.raises(oidc.OidcProtocolError, match="PKCE S256"):\n        oidc._parse_discovery(cfg, no_pkce)\n\n    no_code = {\n        "issuer": cfg.issuer,\n        "authorization_endpoint": cfg.issuer + "/authorize",\n        "token_endpoint": cfg.issuer + "/token",\n        "jwks_uri": cfg.issuer + "/jwks",\n        "response_types_supported": ["id_token"],\n        "id_token_signing_alg_values_supported": ["RS256"],\n    }\n    with pytest.raises(oidc.OidcProtocolError, match="Authorization Code"):\n        oidc._parse_discovery(cfg, no_code)\n\n    missing_signing_metadata = {\n        "issuer": cfg.issuer,\n        "authorization_endpoint": cfg.issuer + "/authorize",\n        "token_endpoint": cfg.issuer + "/token",\n        "jwks_uri": cfg.issuer + "/jwks",\n        "response_types_supported": ["code"],\n    }\n    with pytest.raises(oidc.OidcProtocolError, match="id_token_signing_alg_values_supported"):\n        oidc._parse_discovery(cfg, missing_signing_metadata)\n''',
          )

          p = Path("backend/tests/test_auth_oidc.py")
          text = p.read_text(encoding="utf-8")
          anchor = '''\n\n@pytest.mark.asyncio\nasync def test_complete_oidc_login_consumes_transaction_and_issues_authorized_principal(monkeypatch):\n'''
          addition = '''\n\n@pytest.mark.asyncio\nasync def test_hmac_id_token_uses_client_secret_without_fetching_jwks(monkeypatch):\n    cfg = _config(\n        oidc_client_secret="authentik-generated-client-secret",\n        oidc_allow_all=True,\n        oidc_allowed_groups=[],\n    )\n    disc = _discovery(cfg, signing_algorithms=("HS256",))\n    transaction = _transaction(cfg, disc, nonce="expected-nonce")\n    now = int(time.time())\n    key = OctKey.import_key(cfg.client_secret, {"use": "sig"})\n\n    def encoded(audience=None):\n        claims = {\n            "iss": cfg.issuer,\n            "sub": "user-1",\n            "aud": audience if audience is not None else cfg.client_id,\n            "exp": now + 300,\n            "iat": now,\n            "nonce": "expected-nonce",\n        }\n        if isinstance(claims["aud"], list):\n            claims["azp"] = cfg.client_id\n        return jwt.encode(\n            {"alg": "HS256"},\n            claims,\n            key,\n            algorithms=["HS256"],\n        )\n\n    async def unexpected_jwks_fetch(_url):\n        raise AssertionError("MAC-signed ID token must use client_secret, not JWKS")\n\n    monkeypatch.setattr(oidc, "_fetch_json", unexpected_jwks_fetch)\n    valid = await oidc.validate_id_token({"id_token": encoded()}, transaction)\n    assert valid["sub"] == "user-1"\n\n    with pytest.raises(oidc.OidcProtocolError, match="single audience"):\n        await oidc.validate_id_token(\n            {"id_token": encoded([cfg.client_id, "other-audience"])},\n            transaction,\n        )\n'''
          if anchor not in text:
              raise SystemExit("test_auth_oidc.py: insertion anchor not found")
          text = text.replace(anchor, addition + anchor, 1)
          p.write_text(text, encoding="utf-8")

          Path(".github/workflows/audit-loop-correction-v8.yml").unlink(missing_ok=True)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Validate corrected authentication tree
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit corrected tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Close authentication state and OIDC interoperability gaps"
          git push origin HEAD:work/v1.0.6-auth-overhaul
