name: Auth Phase 3 Fix and Validate

on:
  push:
    branches:
      - work/v1.0.6-auth-overhaul

permissions:
  contents: write

jobs:
  repair-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, '[auth-phase3-green]') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout auth work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-auth-overhaul
          fetch-depth: 0

      - name: Apply Phase 3 wiring and test-contract updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected patch context not found in {path}')
              p.write_text(text.replace(old, new, 1))

          index = Path('frontend/static/index.html')
          text = index.read_text()
          app_tag = '<script src="/app.js?v=12" defer></script>'
          auth_tag = '<script src="/auth.js?v=1" defer></script>'
          if auth_tag not in text:
              if app_tag not in text:
                  raise SystemExit('app.js tag not found in index')
              text = text.replace(app_tag, auth_tag + '\n' + app_tag, 1)
              index.write_text(text)
          if text.index(auth_tag) > text.index(app_tag):
              raise SystemExit('auth bootstrap must load before app.js')

          phase1 = Path('backend/tests/test_auth_phase1.py')
          text = phase1.read_text()
          text = text.replace(
              '    middleware.password_failure_throttle.clear()\n',
              '    from auth.throttle import password_failure_throttle\n\n    password_failure_throttle.clear()\n',
              1,
          )
          text = text.replace(
              '    assert "enforce_password_http_auth" in main\n',
              '    assert "enforce_authentication" in main\n',
              1,
          )
          phase1.write_text(text)

          architecture = Path('backend/tests/test_v105_architecture.py')
          text = architecture.read_text()
          old = '''def test_security_contracts():
              routes = text("backend/api/routes.py")
              main = text("backend/main.py")
              config = text("backend/core/config.py")
              assert "_SECRET_SETTINGS" in routes
              assert 'data[field] = ""' in routes
              assert '"/api/health"' in main
              assert '"/api/stats"' not in main.split("_AUTH_EXEMPT =", 1)[1].split("\\n", 1)[0]
              assert 'allow_origins=["*"]' not in main
              assert "os.chmod(CONFIG_PATH, 0o600)" in config
          '''.replace('          ', '')
          new = '''def test_security_contracts():
              routes = text("backend/api/routes.py")
              main = text("backend/main.py")
              policy = text("backend/auth/policy.py")
              config = text("backend/core/config.py")
              assert "_SECRET_SETTINGS" in routes
              assert 'data[field] = ""' in routes
              assert '"/api/health"' in policy
              assert '"/api/stats"' not in policy
              assert "enforce_authentication" in main
              assert 'allow_origins=["*"]' not in main
              assert "os.chmod(CONFIG_PATH, 0o600)" in config
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('v105 architecture security block not found')
          architecture.write_text(text.replace(old, new, 1))

          audit = Path('backend/tests/test_v105_audit_regressions.py')
          text = audit.read_text()
          start = text.index('@pytest.mark.asyncio\nasync def test_basic_auth_rejects_cross_origin_mutation')
          end = text.index('\ndef test_readme_describes_sqlite_only_runtime', start)
          replacement = r'''@pytest.mark.asyncio
          async def test_auth_boundary_rejects_cross_origin_mutation(monkeypatch):
              import auth.middleware as middleware
              from auth.passwords import hash_password

              cfg = SimpleNamespace(
                  auth_password_enabled=True,
                  auth_username="user",
                  auth_password_hash=hash_password("pass"),
              )
              monkeypatch.setattr(middleware, "get_settings", lambda: cfg)
              token = base64.b64encode(b"user:pass").decode()
              request = _request(
                  "POST",
                  "/api/does-not-exist",
                  {
                      "Authorization": f"Basic {token}",
                      "Origin": "https://evil.invalid",
                      "Host": "testserver",
                  },
              )
              call_next = AsyncMock(return_value=Response(status_code=204))

              async def through_auth(inner_request):
                  return await middleware.enforce_authentication(inner_request, call_next)

              response = await middleware.enforce_general_web_security(request, through_auth)
              assert response.status_code == 403
              call_next.assert_not_awaited()


          @pytest.mark.asyncio
          async def test_auth_boundary_allows_same_origin_and_nonbrowser_basic_clients(monkeypatch):
              import auth.middleware as middleware
              from auth.passwords import hash_password
              from auth.throttle import password_failure_throttle

              cfg = SimpleNamespace(
                  auth_password_enabled=True,
                  auth_username="user",
                  auth_password_hash=hash_password("pass"),
              )
              monkeypatch.setattr(middleware, "get_settings", lambda: cfg)
              password_failure_throttle.clear()
              token = base64.b64encode(b"user:pass").decode()
              auth = f"Basic {token}"

              async def run(request):
                  call_next = AsyncMock(return_value=Response(status_code=204))

                  async def through_auth(inner_request):
                      return await middleware.enforce_authentication(inner_request, call_next)

                  response = await middleware.enforce_general_web_security(request, through_auth)
                  return response, call_next

              same_origin = _request(
                  "POST",
                  "/api/test",
                  {"Authorization": auth, "Origin": "http://testserver", "Host": "testserver"},
              )
              response, call_next = await run(same_origin)
              assert response.status_code == 204
              call_next.assert_awaited_once()

              script_client = _request(
                  "POST",
                  "/api/test",
                  {"Authorization": auth, "Host": "testserver"},
              )
              response, call_next = await run(script_client)
              assert response.status_code == 204
              call_next.assert_awaited_once()

          '''.replace('          ', '')
          audit.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Ruff undefined-name audit
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823

      - name: Run full regression suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Compile Python
        run: |
          cd backend
          python -m compileall -q .

      - name: Check JavaScript syntax
        run: |
          node --check frontend/static/auth.js
          node --check frontend/static/app.js

      - name: Audit Python dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: Bandit high severity/high confidence
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Commit validated Phase 3 repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/static/index.html \
                  backend/tests/test_auth_phase1.py \
                  backend/tests/test_v105_architecture.py \
                  backend/tests/test_v105_audit_regressions.py
          if git diff --cached --quiet; then
            echo 'No repair diff to commit.'
            exit 0
          fi
          git commit -m '[auth-phase3-green] Wire browser sessions and update auth contracts'
          git push origin HEAD:work/v1.0.6-auth-overhaul
