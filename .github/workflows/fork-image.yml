name: Fork Image

on:
  push:
    branches:
      - main
      - 'staging/**'
    tags:
      - 'internal-v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_sha:
        description: Publish an immutable SHA image from an approved branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/xipher-zero/alldebrid-client
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build test image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/alldebrid-client:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail

          container_name="alldebrid-client-smoke"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container_name" \
            --env PUID=0 \
            --env PGID=0 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/alldebrid.db \
            "local/alldebrid-client:${GITHUB_SHA}"

          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" \
              curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health >/dev/null; then
              healthy=1
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

  publish:
    name: Publish immutable image
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_sha &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/fix/') ||
          startsWith(github.ref, 'refs/heads/chore/')
        )
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/internal-v') }}

      - name: Build and publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
