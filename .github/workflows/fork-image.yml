name: Fork Image

on:
  push:
    branches:
      - main
      - 'staging/**'
    tags:
      - 'internal-v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_sha:
        description: Publish an immutable SHA image from an approved branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/xipher-zero/alldebrid-client
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Generate test image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: local/alldebrid-client
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=AllDebrid Control & Download Center
            org.opencontainers.image.description=Self-hosted AllDebrid download control for torrents and direct links
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build test image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/alldebrid-client:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail

          container_name="alldebrid-client-smoke"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container_name" \
            --env PUID=0 \
            --env PGID=0 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/alldebrid.db \
            "local/alldebrid-client:${GITHUB_SHA}"

          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" \
              curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health >/dev/null; then
              healthy=1
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          expected_version="${{ steps.version.outputs.version }}"
          expected_title="AllDebrid Control & Download Center"
          image_ref="local/alldebrid-client:${GITHUB_SHA}"

          image_version="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_title="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          health_payload="$(docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health)"
          health_version="$(jq -r '.version // empty' <<< "$health_payload")"

          if [ "$image_version" != "$expected_version" ]; then
            echo "OCI version mismatch: expected $expected_version, got $image_version"
            exit 1
          fi

          if [ "$image_title" != "$expected_title" ]; then
            echo "OCI title mismatch: expected $expected_title, got $image_title"
            exit 1
          fi

          if [ "$health_version" != "$expected_version" ]; then
            echo "Health version mismatch: expected $expected_version, got $health_version"
            exit 1
          fi

  publish:
    name: Publish immutable image
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_sha &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/fix/') ||
          startsWith(github.ref, 'refs/heads/chore/')
        )
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/internal-v') }}
          labels: |
            org.opencontainers.image.title=AllDebrid Control & Download Center
            org.opencontainers.image.description=Self-hosted AllDebrid download control for torrents and direct links
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify generated image metadata
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          expected_version="${{ steps.version.outputs.version }}"
          expected_title="AllDebrid Control & Download Center"
          generated_version="$(jq -r '.labels["org.opencontainers.image.version"] // empty' <<< "$METADATA_JSON")"
          generated_title="$(jq -r '.labels["org.opencontainers.image.title"] // empty' <<< "$METADATA_JSON")"

          if [ "$generated_version" != "$expected_version" ]; then
            echo "Generated OCI version mismatch: expected $expected_version, got $generated_version"
            exit 1
          fi

          if [ "$generated_title" != "$expected_title" ]; then
            echo "Generated OCI title mismatch: expected $expected_title, got $generated_title"
            exit 1
          fi

      - name: Build and publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
