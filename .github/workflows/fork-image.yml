name: Fork Image

on:
  push:
    branches:
      - staging/ui-cleanup-runner

permissions:
  contents: write

jobs:
  apply-db-ui-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Remove obsolete runtime database card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/static/app.js')
          text = path.read_text(encoding='utf-8')
          old = '''      <div class="scard">
      <div class="scard-header">🗄️ Database</div>
      <div class="scard-body">
        <div class="form-group">
          <label class="form-label">Runtime Database</label>
          <input class="input" value="SQLite (internal, WAL)" disabled/>
          <span class="form-hint">SQLite is the authoritative and only runtime database in DebridPulse 1.0.5.</span>
        </div>
      </div>
    </div>

'''
          if old in text:
              path.write_text(text.replace(old, '', 1), encoding='utf-8')
              print('Removed obsolete runtime database card.')
          else:
              print('Runtime database card already absent.')

          trigger = Path('.github/ui-cleanup.trigger')
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Commit cleanup if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/static/app.js .github/ui-cleanup.trigger
          git commit -m "Remove obsolete runtime database selector"
          git push origin "HEAD:${{ github.ref_name }}"
