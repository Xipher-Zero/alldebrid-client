name: Fork Image

on:
  pull_request:
    branches:
      - staging/ui-cleanup-base

permissions:
  contents: write

jobs:
  apply-db-ui-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove obsolete runtime database card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/static/app.js')
          text = path.read_text(encoding='utf-8')
          old = '''      <div class="scard">
      <div class="scard-header">🗄️ Database</div>
      <div class="scard-body">
        <div class="form-group">
          <label class="form-label">Runtime Database</label>
          <input class="input" value="SQLite (internal, WAL)" disabled/>
          <span class="form-hint">SQLite is the authoritative and only runtime database in DebridPulse 1.0.5.</span>
        </div>
      </div>
    </div>

'''
          if old not in text:
              raise SystemExit('Obsolete runtime database card not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Commit UI cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/static/app.js
          git commit -m "Remove obsolete runtime database selector"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
