name: Apply v1.0.2 performance pass 3 once

on:
  pull_request:
    branches:
      - automation/pass3-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/pass3-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.2-ui-responsiveness
          fetch-depth: 0

      - name: Verify exact baseline
        run: |
          expected="04261b0e3ed2849a04a4329ca5f9cd259a5ff551"
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to repair an unexpected baseline"
            exit 1
          fi

      - name: Restore full changelog and insert v1.0.2 clarification
        run: |
          git show 67be9289e9117475ad590522d9229b42cd6ad132:CHANGELOG.md > /tmp/changelog-before
          cp /tmp/changelog-before CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '- Reduced no-op provider/aria2 database writes and SSE churn so transfer freshness reflects real progress.\n'
          addition = '- Preserved local aria2 transfer status, progress, and size while AllDebrid is already in the ready state so provider reconciliation cannot overwrite live local telemetry.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one changelog marker, found {text.count(marker)}')
          if addition in text:
              raise SystemExit('clarification already present')
          p.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')
          PY

      - name: Validate repair scope and exact restored history
        run: |
          test "$(git diff --name-only | tr -d '\r')" = "CHANGELOG.md"
          python - <<'PY'
          from pathlib import Path
          old = Path('/tmp/changelog-before').read_text(encoding='utf-8')
          new = Path('CHANGELOG.md').read_text(encoding='utf-8')
          addition = '- Preserved local aria2 transfer status, progress, and size while AllDebrid is already in the ready state so provider reconciliation cannot overwrite live local telemetry.\n'
          if new.count(addition) != 1:
              raise SystemExit(f'expected one clarification, found {new.count(addition)}')
          if new.replace(addition, '', 1) != old:
              raise SystemExit('restored changelog differs from prior full history beyond the intended clarification')
          print('CHANGELOG RESTORE CONTRACT: PASS')
          PY

      - name: Commit changelog repair to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          test "$(git diff --cached --name-only | tr -d '\r')" = "CHANGELOG.md"
          git commit -m "fix: restore full v1.0.2 changelog history"
          git push origin HEAD:work/v1.0.2-ui-responsiveness
