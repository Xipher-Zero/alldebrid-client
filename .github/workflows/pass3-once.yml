name: Apply v1.0.2 performance pass 3 once

on:
  pull_request:
    branches:
      - automation/pass3-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/pass3-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.2-ui-responsiveness
          fetch-depth: 0

      - name: Verify exact baseline
        run: |
          expected="414074eadee8792450cc7e45b15171d1ef2de7b9"
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to patch an unexpected baseline"
            exit 1
          fi

      - name: Materialize guarded CI fix from automation base
        run: |
          git fetch origin automation/pass3-base
          git show origin/automation/pass3-base:.pass3_ci_fix.py > .pass3_ci_fix.py

      - name: Apply guarded pass 3 CI compatibility fix
        run: python .pass3_ci_fix.py

      - name: Remove temporary local patcher
        run: rm .pass3_ci_fix.py

      - name: Static syntax checks
        run: |
          python -m py_compile backend/services/manager_v2.py
          node --check frontend/static/app.js
          git diff --check

      - name: Commit CI fix to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/manager_v2.py
          git diff --cached --check
          git commit -m "fix: tolerate legacy aria2 sync row fixtures"
          git push origin HEAD:work/v1.0.2-ui-responsiveness
