name: Apply v1.0.2 UI cleanup once

on:
  pull_request:
    branches:
      - automation/pass3-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/pass3-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.2-ui-responsiveness
          fetch-depth: 0

      - name: Verify exact baseline
        run: |
          expected="94c35a1334cc3e206a8dc0d5ac0f889e3a08c6c4"
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to operate on an unexpected baseline"
            exit 1
          fi

      - name: Fast-forward staging branch
        run: |
          git push origin HEAD:staging/v1.0.2-ui-responsiveness
