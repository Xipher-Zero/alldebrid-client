name: Apply v1.0.2 performance pass 3 once

on:
  pull_request:
    branches:
      - automation/pass3-base

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/pass3-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.2-ui-responsiveness
          fetch-depth: 0

      - name: Verify exact baseline
        run: |
          expected="a3105ed50aae1f185423cd83845c4c5c79606b34"
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected"
          echo "actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to patch an unexpected baseline"
            exit 1
          fi

      - name: Materialize guarded follow-up from automation base
        run: |
          git fetch origin automation/pass3-base
          git show origin/automation/pass3-base:.pass3_fix.py > .pass3_fix.py

      - name: Apply guarded pass 3 follow-up
        run: python .pass3_fix.py

      - name: Normalize generated test EOF and remove local patcher
        run: |
          python -c "from pathlib import Path; p=Path('backend/tests/test_ui_responsiveness.py'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          rm .pass3_fix.py

      - name: Static syntax checks
        run: |
          python -m py_compile backend/services/manager_v2.py
          python -m py_compile backend/tests/test_ui_responsiveness.py
          node --check frontend/static/app.js
          git diff --check

      - name: Commit follow-up to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/manager_v2.py backend/tests/test_ui_responsiveness.py
          git diff --cached --check
          git commit -m "fix: preserve pass3 provider no-op semantics"
          git push origin HEAD:work/v1.0.2-ui-responsiveness
