name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply paused-intake lifecycle hardening
        run: |
          python .github/v106_paused_intake_lifecycle.py
          cp .github/tests.permanent.yml .github/workflows/tests.yml
          rm .github/tests.permanent.yml

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check syntax
        run: |
          cd backend
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Security gates
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Patch hygiene
        run: git diff --check

      - name: Build and smoke image
        run: |
          docker build -t debridpulse:v106-paused-intake-lifecycle .
          docker run -d --rm --name debridpulse-v106-gate -p 127.0.0.1:18082:8080 debridpulse:v106-paused-intake-lifecycle
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/api/health >/tmp/health.json; then
              cat /tmp/health.json
              docker stop debridpulse-v106-gate >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs debridpulse-v106-gate || true
          exit 1

      - name: Commit validated lifecycle hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Harden paused intake lifecycle'
          git push origin HEAD:work/v1.0.6-audit-cleanup
