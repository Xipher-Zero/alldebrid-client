name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-manager-f821-fix:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.5-architecture
          fetch-depth: 0

      - name: Apply exact manager fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/services/manager_v2.py')
          text = path.read_text()
          old_import = 'from services.aria2 import Aria2ConnectionError, Aria2RPCError, Aria2Service'
          new_import = 'from services.aria2 import Aria2ConnectionError, Aria2DownloadStatus, Aria2RPCError, Aria2Service'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          dead = '''\n        logger.info(\n            "Startup aria2 reconciliation: %d file(s) checked, %d finalized, %d reset",\n            len(rows), len(touched), len(reset_torrents),\n        )\n'''
          if dead in text:
              text = text.replace(dead, '\n', 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit source fix if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/services/manager_v2.py; then
            echo 'Manager already corrected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/manager_v2.py
          git commit -m 'Fix manager undefined-name residue'
          git push origin HEAD:work/v1.0.5-architecture
