name: Apply v1.0.6 Final Audit Cleanup

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Check whether cleanup is pending
        id: gate
        shell: bash
        run: |
          if [ -f tools/v106_cleanup.part00 ] && [ -f tools/v106_cleanup.part01 ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Cleanup payload already consumed; nothing to apply."
          fi

      - name: Set up Python 3.12
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Reconstruct and apply audit cleanup
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v106_cleanup.part00 tools/v106_cleanup.part01 \
            | base64 --decode \
            | gzip --decompress \
            > tools/v106_final_audit_cleanup.py
          python tools/v106_final_audit_cleanup.py

      - name: Install validation tools
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Check undefined Python names
        if: steps.gate.outputs.apply == 'true'
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        if: steps.gate.outputs.apply == 'true'
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        if: steps.gate.outputs.apply == 'true'
        run: |
          cd backend
          python -m compileall -q .

      - name: Check frontend JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        run: node --check frontend/static/app.js

      - name: Audit Python dependencies
        if: steps.gate.outputs.apply == 'true'
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: Run high-confidence security lint
        if: steps.gate.outputs.apply == 'true'
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Commit validated source cleanup
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v106_final_audit_cleanup.py
          git rm tools/v106_cleanup.part00 tools/v106_cleanup.part01
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/tests.yml'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Complete v1.0.6 audit and unify dashboard input"
          git push origin HEAD:work/v1.0.6-audit-cleanup
