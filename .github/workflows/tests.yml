name: Apply v1.0.6 Final Audit Cleanup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply readable asserted cleanup
        shell: bash
        run: |
          set -euo pipefail

          # Preserve the active /recovery/run feature while removing its
          # transitional wrapper module: route it straight through the
          # authoritative ReconciliationService boundary first.
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/api/routes.py')
          source = path.read_text()
          old = '''    from services.recovery import run_recovery_checks\n    result = await run_recovery_checks()'''
          new = '''    result = await transfer_service.reconciliation.recover()'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one recovery wrapper route, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('tools/v106_direct_cleanup.py')
          source = path.read_text()

          raw_needle = "extra = r'''"
          if source.count(raw_needle) != 1:
              raise SystemExit(f'expected one raw regression block, found {source.count(raw_needle)}')
          source = source.replace(raw_needle, "extra = '''", 1)

          subn_old = "app, count = re.subn(old_handlers_pattern, new_handlers, app, count=1, flags=re.S)"
          subn_new = "app, count = re.subn(old_handlers_pattern, lambda _match: new_handlers, app, count=1, flags=re.S)"
          if source.count(subn_old) != 1:
              raise SystemExit(f'expected one app.js regex substitution, found {source.count(subn_old)}')
          source = source.replace(subn_old, subn_new, 1)

          scan_old = '''all_python = "\\n".join(\n    p.read_text(errors="ignore")\n    for p in (ROOT / "backend").rglob("*.py")\n)'''
          scan_new = '''all_python = "\\n".join(\n    p.read_text(errors="ignore")\n    for p in (ROOT / "backend").rglob("*.py")\n    if "tests" not in p.parts\n)'''
          if source.count(scan_old) != 1:
              raise SystemExit(f'expected one backend residue scan, found {source.count(scan_old)}')
          source = source.replace(scan_old, scan_new, 1)

          path.write_text(source)
          PY

          python tools/v106_direct_cleanup.py

          # Retire/update stale historical regression contracts whose surfaces
          # are deliberately removed or unified by this pass.
          python - <<'PY'
          import re
          from pathlib import Path

          audit = Path('backend/tests/test_v105_audit_regressions.py')
          source = audit.read_text()
          pattern = r'\ndef test_mediainfo_service_uses_real_path_ancestry\(.*?(?=\n\n@pytest\.mark\.asyncio\nasync def test_service_permission_error_maps_to_http_403)'
          source, count = re.subn(pattern, '', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one stale MediaInfo regression, found {count}')
          audit.write_text(source)

          scope = Path('backend/tests/test_v1_scope.py')
          source = scope.read_text()
          pattern = r'def test_direct_link_input_expands_to_five_lines_and_resets_after_submit\(\):.*?(?=\n\ndef test_release_workflow_accepts_public_v1_tags)'
          replacement = '''def test_unified_submission_input_expands_to_five_lines():\n    frontend = (REPO_ROOT / "frontend/static/index.html").read_text()\n    scripts = (REPO_ROOT / "frontend/static/app.js").read_text()\n    styles = (REPO_ROOT / "frontend/static/style.css").read_text()\n\n    assert 'id="q-transfer-input" rows="2"' in frontend\n    assert 'id="q-debrid-links"' not in frontend\n    assert 'id="q-magnet"' not in frontend\n    assert 'oninput="resizeDebridLinkInput(this)"' in frontend\n    assert "function resizeDebridLinkInput(input)" in scripts\n    assert "const minimum = Math.ceil((lineHeight * 2) + chrome);" in scripts\n    assert "const maximum = Math.ceil((lineHeight * 5) + chrome);" in scripts\n    assert "resizeDebridLinkInput(input);" in scripts\n    assert ".direct-link-input" in styles\n    assert "overflow-y: hidden" in styles\n'''
          source, count = re.subn(pattern, lambda _match: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one stale dashboard input regression, found {count}')
          scope.write_text(source)

          contracts = Path('backend/tests/test_v106_audit_contracts.py')
          source = contracts.read_text()
          addition = '''\n\ndef test_recovery_route_survives_without_transitional_wrapper():\n    root = Path(__file__).resolve().parents[1]\n    routes = (root / "api" / "routes.py").read_text()\n    block = routes.split('async def run_recovery():', 1)[1].split('# ──', 1)[0]\n    assert 'transfer_service.reconciliation.recover()' in block\n    assert 'services.recovery' not in block\n    assert not (root / "services" / "recovery.py").exists()\n'''
          if 'test_recovery_route_survives_without_transitional_wrapper' in source:
              raise SystemExit('recovery boundary contract already present unexpectedly')
          contracts.write_text(source.rstrip() + addition + '\n')
          PY

      - name: Install validation tools
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run full test suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python and frontend syntax
        shell: bash
        run: |
          cd backend
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Audit Python dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: Run high-confidence security lint
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Diff sanity
        run: |
          git diff --check
          git status --short

      - name: Container build and health smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build -t debridpulse:v106-audit-cleanup .
          docker run -d --rm --name debridpulse-v106-audit-smoke -p 18081:8080 debridpulse:v106-audit-cleanup
          trap 'docker rm -f debridpulse-v106-audit-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health >/tmp/debridpulse-health.json; then
              cat /tmp/debridpulse-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs debridpulse-v106-audit-smoke
          exit 1

      - name: Commit validated source and restore permanent CI
        shell: bash
        run: |
          set -euo pipefail
          git show 605df2802d51c8e2668e0bbaef50d4994de37fff:.github/workflows/tests.yml > .github/workflows/tests.yml
          git rm -f tools/v106_direct_cleanup.py .github/workflows/v106-direct-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete v1.0.6 audit cleanup and unify dashboard input"
          git push origin HEAD:work/v1.0.6-audit-cleanup
