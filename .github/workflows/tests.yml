name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/static/app.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
