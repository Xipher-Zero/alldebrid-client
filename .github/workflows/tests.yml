# PR regression and security validation.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Apply final v1.0.6 audit corrections when needed
        run: |
          if ! grep -q 'def _public_timestamp' backend/api/serializers.py; then
            python tools/v106_final_audit_patch.py
            python tools/v106_final_audit_fixup.py
          else
            echo 'Corrective source already present'
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/static/app.js

      - name: Commit corrected source after validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/api/serializers.py \
            backend/api/routes.py \
            backend/core/branding.py \
            backend/core/config.py \
            backend/core/scheduler.py \
            backend/db/database.py \
            backend/services/aria2.py \
            backend/services/aria2_runtime.py \
            backend/services/backup.py \
            backend/services/db_maintenance.py \
            backend/services/maintenance_gate.py \
            backend/services/manager_v2.py \
            backend/services/provider_gateway.py \
            backend/services/stats.py \
            backend/services/transfer_service.py \
            backend/tests/test_license_policy.py \
            backend/tests/test_v1_scope.py \
            frontend/static/app.js \
            NOTICE \
            .github/workflows/fork-image.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix final v1.0.6 audit findings"
            git push origin HEAD:work/v1.0.6-audit-cleanup
          fi

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
