# PR regression and security validation.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/static/app.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  v106-followup:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/v1.0.6-audit-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Apply follow-up audit corrections
        run: python tools/v106_followup_patch.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Corrected-tree regression and security gates
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m pytest tests/ -v --tb=short
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js
          git diff --check
          cd backend
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Publish validated corrected tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Remove the temporary execution harness and restore the normal CI file.
          git checkout a4642bd6979c9cbc73fbb5e3e2e9be83f9ab287b -- .github/workflows/tests.yml
          rm -f tools/v106_followup_patch.py

          git add \
            frontend/static/app.js \
            backend/db/database.py \
            backend/core/scheduler.py \
            backend/api/routes.py \
            backend/main.py \
            backend/services/manager_v2.py \
            backend/services/extractor.py \
            backend/tests/test_v106_corrective_regressions.py \
            CHANGELOG.md \
            SECURITY.md \
            .github/workflows/tests.yml
          git add -u -- tools/v106_followup_patch.py
          git diff --cached --check
          git commit -m 'fix: close remaining v1.0.6 audit defects'
          git push origin HEAD:work/v1.0.6-audit-cleanup
