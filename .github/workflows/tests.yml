name: Tests

on:
  push:
    branches: ['staging/v105-correction-runner']

permissions:
  contents: write

jobs:
  apply-v105-corrections:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: staging/v105-correction-runner
          fetch-depth: 0

      - name: Apply audit corrections
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/v105_audit_corrections.py ]; then
            echo 'Correction script already consumed; nothing to do.'
            exit 0
          fi
          python tools/v105_audit_corrections.py
          # Keep this registered runner unchanged; permanent CI is restored
          # on the work branch after the corrected source commit exists.
          git checkout HEAD -- .github/workflows/tests.yml
          git rm tools/v105_audit_corrections.py

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No corrections to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/core/scheduler.py \
            backend/services/notification_service.py \
            backend/services/notifications.py \
            backend/services/aria2_gateway.py \
            backend/db/database.py \
            backend/services/transfer_control_service.py \
            backend/services/transfer_service.py \
            backend/services/db_maintenance.py \
            backend/services/backup.py \
            backend/api/routes.py \
            backend/main.py \
            README.md \
            index.html \
            backend/tests/test_v105_audit_regressions.py \
            tools/v105_audit_corrections.py
          git commit -m 'Fix v1.0.5 audit findings and add regressions'
          git push origin HEAD:staging/v105-correction-runner
