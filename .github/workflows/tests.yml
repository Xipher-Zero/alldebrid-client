name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v106-core-cleanup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Apply deterministic v1.0.6 core cleanup
        run: python tools/v106_core_cleanup.py

      - name: Restore permanent CI workflow
        shell: bash
        run: |
          cat > .github/workflows/tests.yml <<'YAML'
          name: Tests

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              env:
                FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

              steps:
                - name: Checkout
                  uses: actions/checkout@v5

                - name: Set up Python 3.12
                  uses: actions/setup-python@v6
                  with:
                    python-version: '3.12'
                    cache: 'pip'
                    cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-dev.txt

                - name: Install dependencies
                  run: |
                    cd backend
                    pip install -r requirements-dev.txt
                    pip install ruff

                - name: Check undefined Python names
                  run: |
                    cd backend
                    ruff check api core db services main.py --select F821,F822,F823

                - name: Run all tests
                  run: |
                    cd backend
                    python -m pytest tests/ -v --tb=short

                - name: Check Python syntax
                  run: |
                    cd backend
                    python -m compileall -q .
                    echo "All Python modules compile"

                - name: Check frontend JavaScript syntax
                  run: node --check frontend/static/app.js

            security:
              runs-on: ubuntu-latest
              env:
                FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
              needs: test

              steps:
                - name: Checkout
                  uses: actions/checkout@v5

                - name: Set up Python 3.12
                  uses: actions/setup-python@v6
                  with:
                    python-version: '3.12'
                    cache: 'pip'
                    cache-dependency-path: backend/requirements.txt

                - name: Install dependencies + audit tools
                  run: |
                    cd backend
                    pip install -r requirements.txt
                    pip install pip-audit bandit

                - name: pip-audit (known CVEs in dependencies)
                  run: |
                    cd backend
                    pip-audit -r requirements.txt --progress-spinner off

                - name: bandit (Python security linting)
                  run: |
                    cd backend
                    bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          YAML

      - name: Remove patch helper and commit
        run: |
          git rm tools/v106_core_cleanup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply v1.0.6 core audit corrections"
          git push origin HEAD:work/v1.0.6-audit-cleanup
