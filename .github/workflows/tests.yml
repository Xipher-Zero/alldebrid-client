name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v106-final-audit-cleanup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Apply deterministic final v1.0.6 audit cleanup
        run: python tools/v106_final_audit_cleanup.py

      - name: Remove patch helper and commit source only
        run: |
          git rm tools/v106_final_audit_cleanup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/tests.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Close final v1.0.6 audit residues"
          git push origin HEAD:work/v1.0.6-audit-cleanup
