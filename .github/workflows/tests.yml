name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run v1.0.6 audit contracts
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py -q --tb=short

      - name: Run UI responsiveness contracts
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_ui_responsiveness.py -q --tb=short

      - name: Run extractor contracts
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_extractor.py -q --tb=short

      - name: Run remaining suite
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_v106_audit_contracts.py \
            --ignore=tests/test_ui_responsiveness.py \
            --ignore=tests/test_extractor.py
