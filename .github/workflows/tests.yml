name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-contracts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Architecture and serializer contracts
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py::test_transfer_service_has_no_transparent_legacy_fallback \
            tests/test_v106_audit_contracts.py::test_state_machine_does_not_import_http_layer \
            tests/test_v106_audit_contracts.py::test_state_machine_uses_repository_instead_of_database_layer \
            tests/test_v106_audit_contracts.py::test_external_gateway_rejects_foreign_gid \
            tests/test_v106_audit_contracts.py::test_public_serializers_strip_capability_urls -q --tb=short

      - name: Destructive and scheduler contracts
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py::test_backup_rotation_requires_ownership_manifest \
            tests/test_v106_audit_contracts.py::test_database_wipe_requires_verified_quiescence \
            tests/test_v106_audit_contracts.py::test_entrypoint_does_not_recursive_chown_downloads_by_default \
            tests/test_v106_audit_contracts.py::test_scheduler_has_single_reconciliation_loop -q --tb=short

      - name: Extraction and provider contracts
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py::test_zip_preflight_rejects_file_count_budget \
            tests/test_v106_audit_contracts.py::test_external_staging_rejects_symlink_output \
            tests/test_v106_audit_contracts.py::test_7z_listing_budget_is_validated_before_extraction \
            tests/test_v106_audit_contracts.py::test_alldebrid_client_rate_limits_multipart_uploads -q --tb=short

      - name: Materialization event contract
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py::test_materialization_engine_publishes_without_importing_http_layer -q --tb=short

      - name: RAR fail-closed contract
        if: success() || failure()
        run: |
          cd backend
          python -m pytest tests/test_v106_audit_contracts.py::test_rar_extraction_fails_closed_without_preflight_capable_7z -q --tb=short
