# PR regression and security validation.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/static/app.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  publish-v106-fixtures:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'work/v1.0.6-audit-cleanup' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Apply validated ownership fixture updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_manager_v2.py')
          text = path.read_text(encoding='utf-8')

          old = '''            "alldebrid_id": "ad-67",\n            "error_message": "No peers after 30 minutes",\n'''
          new = '''            "alldebrid_id": "ad-67",\n            "source": "manual",\n            "error_message": "No peers after 30 minutes",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'provider fixture match count={text.count(old)}')
          text = text.replace(old, new, 1)

          start = text.index('    async def test_duplicate_file_entries_skipped')
          end = text.index('\n\nclass Aria2RecoverySafetyTests', start)
          block = text[start:end]
          old = '''        fake_db.commit = AsyncMock()\n        fake_db.execute = AsyncMock(return_value=AsyncMock())\n'''
          new = '''        fake_cursor = AsyncMock()\n        fake_cursor.fetchone = AsyncMock(return_value={"source": "manual"})\n        fake_db.commit = AsyncMock()\n        fake_db.execute = AsyncMock(return_value=fake_cursor)\n'''
          if block.count(old) != 1:
              raise SystemExit(f'duplicate-file fixture match count={block.count(old)}')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          for test_name, torrent_id, ad_id in (
              ('test_finalize_marks_completed_when_all_files_done', 1, 'ad-1'),
              ('test_finalize_updates_large_total_size_without_case_expression', 116, 'ad-116'),
          ):
              start = text.index(f'    async def {test_name}')
              next_async = text.find('\n    async def ', start + 10)
              next_class = text.find('\n\nclass ', start + 10)
              ends = [value for value in (next_async, next_class) if value != -1]
              end = min(ends) if ends else len(text)
              block = text[start:end]
              if '"source": None' not in block:
                  raise SystemExit(f'{test_name}: source fixture missing')
              block = block.replace('"source": None', '"source": "manual"', 1)
              expected = f'assert_awaited_once_with({torrent_id}, "{ad_id}")'
              replacement = f'assert_awaited_once_with({torrent_id}, "{ad_id}", "manual")'
              if expected not in block:
                  raise SystemExit(f'{test_name}: expectation missing')
              block = block.replace(expected, replacement, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_manager_v2.py
          git commit -m 'test: align provider ownership fixtures'
          git push origin HEAD:work/v1.0.6-audit-cleanup
