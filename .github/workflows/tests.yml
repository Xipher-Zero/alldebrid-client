name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: node --check frontend/static/app.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  v106-corrective:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'work/v1.0.6-audit-cleanup' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply and validate corrective tree
        id: corrective
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python tools/sitecustomize.py
            python tools/v106_corrective_patch.py
            python tools/sitecustomize.py
            python tools/v106_corrective_postpatch.py

            mkdir -p frontend/static/vendor
            curl --fail --location --silent --show-error \
              https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js \
              --output frontend/static/vendor/chart.umd.min.js
            echo 'd2af8974e95271638772e9e9524db5b9a6f58d6ec2d5d781400447b4a31c681e  frontend/static/vendor/chart.umd.min.js' | sha256sum -c -

            cd backend
            pip install -r requirements-dev.txt
            pip install ruff pip-audit bandit
            ruff check api core db services main.py --select F821,F822,F823
            python -m compileall -q .
            python -m pytest tests/ -v --tb=short
            pip-audit -r requirements.txt --progress-spinner off
            bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
            cd ..

            node --check frontend/static/app.js
            git diff --check
            ! grep -R 'cdnjs.cloudflare.com/ajax/libs/Chart.js' frontend/static
            grep -q 'javascript-typescript' .github/workflows/codeql.yml
            grep -q 'release_database_wipe_quiescence' backend/api/routes.py
            grep -q 'clear_secrets' frontend/static/app.js
            grep -q '_provider_delete_authorized' backend/services/manager_v2.py
          ) 2>&1 | tee /tmp/v106-corrective.log
          rc=${PIPESTATUS[0]}
          echo "status=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validated tree or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ '${{ steps.corrective.outputs.status }}' != '0' ]; then
            git reset --hard HEAD
            cp /tmp/v106-corrective.log v106-corrective-failure.log
            git add -f -- v106-corrective-failure.log
            git commit -m 'chore: capture v1.0.6 corrective failure'
            git push origin HEAD:work/v1.0.6-audit-cleanup
            exit 0
          fi

          git checkout fe79d52ce7d18b64480c1e17086ce9be838e3e89 -- .github/workflows/tests.yml
          rm -f tools/v106_corrective_patch.py \
                tools/v106_corrective_postpatch.py \
                .github/workflows/v106-corrective-apply.yml \
                v106-corrective-failure.log

          git add -- \
            .github/workflows/codeql.yml \
            .github/workflows/tests.yml \
            backend/api/routes.py \
            backend/services/manager_v2.py \
            backend/services/provider_gateway.py \
            backend/services/transfer_service.py \
            backend/tests/test_v106_corrective_regressions.py \
            docs/DEPENDENCY_LICENSES.md \
            frontend/static/app.js \
            frontend/static/index.html \
            frontend/static/vendor/chart.umd.min.js \
            licenses/Chart.js-MIT.txt
          git add -u -- \
            tools/v106_corrective_patch.py \
            tools/v106_corrective_postpatch.py \
            .github/workflows/v106-corrective-apply.yml \
            v106-corrective-failure.log || true
          git diff --cached --check
          git commit -m 'fix: close v1.0.6 audit blockers'
          git push origin HEAD:work/v1.0.6-audit-cleanup
