name: Temporary external badge width builder

on:
  push:
    branches:
      - tmp/dashboard-recent-fit-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v5
        with:
          ref: tmp/dashboard-recent-fit-builder
          fetch-depth: 0

      - name: Apply exact one-file CSS patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/static/style.css')
          source = path.read_text()
          old = """#aria2-speed-badge.external-control {
            flex: 0 0 auto;
            width: auto;
            min-width: 0;
            justify-content: flex-start;
          }
          """
          new = """#aria2-speed-badge.external-control {
            flex: 0 0 280px;
            width: 280px;
            min-width: 280px;
            justify-content: flex-start;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('external aria2 outer badge block did not match exactly once')
          source = source.replace(old, new, 1)
          assert 'flex: 0 0 280px;' in source
          assert 'width: 280px;' in source
          assert 'min-width: 280px;' in source
          path.write_text(source)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "frontend/static/style.css"

      - name: Commit patched style.css
        shell: bash
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add frontend/static/style.css
          git commit -m 'Build fixed external aria2 badge width'
          git push origin HEAD:tmp/dashboard-recent-fit-builder
