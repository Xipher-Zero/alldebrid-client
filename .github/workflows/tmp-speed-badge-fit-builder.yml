name: Temporary speed badge fit builder

on:
  push:
    branches:
      - tmp/dashboard-recent-fit-builder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v5
        with:
          ref: tmp/dashboard-recent-fit-builder
          fetch-depth: 0

      - name: Apply exact one-file CSS patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/static/style.css')
          source = path.read_text()
          old = """#aria2-speed-badge.external-control #aria2-badge-speed,
          #aria2-speed-badge.external-control #aria2-badge-limit {
            width: auto;
            text-align: left;
          }
          """
          new = """#aria2-speed-badge.external-control #aria2-badge-speed {
            width: 12ch;
            min-width: 12ch;
            text-align: right;
          }
          #aria2-speed-badge.external-control #aria2-badge-limit {
            width: auto;
            text-align: left;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('external aria2 badge block did not match exactly once')
          source = source.replace(old, new, 1)
          assert '#aria2-speed-badge.external-control #aria2-badge-speed {' in source
          assert 'width: 12ch;' in source
          assert 'min-width: 12ch;' in source
          path.write_text(source)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "frontend/static/style.css"

      - name: Commit patched style.css
        shell: bash
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add frontend/static/style.css
          git commit -m 'Build stable external aria2 speed slot'
          git push origin HEAD:tmp/dashboard-recent-fit-builder
