name: Temporary tighten external badge layout

on:
  push:
    branches:
      - tmp/fix-external-badge-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: tmp/fix-external-badge-layout
          fetch-depth: 0

      - name: Apply exact CSS patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/static/style.css')
          source = path.read_text()
          old = """#aria2-speed-badge.external-control #aria2-badge-speed {
            width: 12ch;
            min-width: 12ch;
            text-align: right;
          }
          """
          new = """#aria2-speed-badge.external-control #aria2-badge-speed {
            width: 72px;
            min-width: 72px;
            text-align: right;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('external speed slot block did not match exactly once')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = "frontend/static/style.css"

      - name: Commit patched CSS
        shell: bash
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add frontend/static/style.css
          git commit -m 'Tighten external aria2 speed slot'
          git push origin HEAD:tmp/fix-external-badge-layout
