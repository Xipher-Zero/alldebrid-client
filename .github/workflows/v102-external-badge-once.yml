name: Apply v1.0.2 external aria2 badge spacing once

on:
  push:
    branches:
      - work/v1.0.2-ui-responsiveness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.0.2 branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.2-ui-responsiveness
          fetch-depth: 0

      - name: Apply spacing correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          style = Path('frontend/static/style.css')
          index = Path('frontend/static/index.html')
          tests = Path('backend/tests/test_v1_scope.py')

          style_text = style.read_text(encoding='utf-8')
          old = '''/* External aria2 read-only topbar state */
          #aria2-speed-badge.external-control {
            flex-basis: 300px;
            width: 300px;
            min-width: 300px;
          }

          #aria2-speed-badge.external-control .aria2-cap-toggle {
            padding-right: 12px;
          }
          @media (max-width: 760px) {
            #aria2-speed-badge.external-control {
              flex-basis: 280px;
              width: 280px;
              min-width: 280px;
            }
          }
          '''
          new = '''/* External aria2 read-only topbar state */
          #aria2-speed-badge.external-control {
            flex: 0 0 auto;
            width: auto;
            min-width: 0;
            justify-content: flex-start;
          }
          #aria2-speed-badge.external-control #aria2-badge-limit {
            width: auto;
            text-align: left;
          }
          '''
          if style_text.count(old) != 1:
              raise SystemExit(f'expected one external aria2 spacing block, found {style_text.count(old)}')
          style.write_text(style_text.replace(old, new, 1), encoding='utf-8')

          index_text = index.read_text(encoding='utf-8')
          if index_text.count('/style.css?v=11') != 1:
              raise SystemExit(f'expected one style cache key, found {index_text.count("/style.css?v=11")}')
          index.write_text(index_text.replace('/style.css?v=11', '/style.css?v=12', 1), encoding='utf-8')

          test_text = tests.read_text(encoding='utf-8')
          if test_text.count("assert '/style.css?v=11' in index") != 1:
              raise SystemExit('expected v11 style cache assertion exactly once')
          tests.write_text(
              test_text.replace("assert '/style.css?v=11' in index", "assert '/style.css?v=12' in index", 1),
              encoding='utf-8',
          )
          PY

      - name: Minimal validation and push
        shell: bash
        run: |
          git diff --check
          grep -Fq 'flex: 0 0 auto;' frontend/static/style.css
          grep -Fq '#aria2-speed-badge.external-control #aria2-badge-limit' frontend/static/style.css
          grep -Fq '/style.css?v=12' frontend/static/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/static/style.css frontend/static/index.html backend/tests/test_v1_scope.py
          git rm .github/workflows/v102-external-badge-once.yml
          git commit -m 'fix: normalize external aria2 badge spacing'
          git push origin HEAD:work/v1.0.2-ui-responsiveness
