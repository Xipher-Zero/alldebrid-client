name: v1.0.4 Surgical Refactor

on:
  push:
    branches:
      - work/v1.0.4-performance-pass-4

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Run v1.0.4 surgical refactor'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.4-performance-pass-4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply exact refactor
        run: python .github/scripts/v104_surgical_refactor.py

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run regression suite
        run: |
          cd backend
          python -m pytest tests/ -q

      - name: Validate Python syntax
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: node --check frontend/static/app.js

      - name: Validate diff
        run: git diff --check

      - name: Commit validated refactor
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add backend/services/manager_v2.py backend/api/routes.py frontend/static/app.js
          git commit -m 'Optimize polling, stats, and batch persistence'
          git push origin HEAD:work/v1.0.4-performance-pass-4
