name: v1.0.5 Architecture Refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  packages: write

jobs:
  refactor:
    if: github.head_ref == 'work/v1.0.5-architecture'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE_NAME: ghcr.io/xipher-zero/debridpulse
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.5-architecture
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply architecture refactor
        run: |
          python tools/v105_refactor.py
          python tools/v105_refactor_fix1.py
          python tools/v105_refactor_fix2.py

      - name: Install test and security dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install pip-audit bandit

      - name: Full test suite
        run: |
          cd backend
          python -m pytest tests/ -q --tb=short

      - name: Compile all Python
        run: |
          cd backend
          python -m compileall -q .

      - name: Frontend syntax
        run: node --check frontend/static/app.js

      - name: Dependency audit
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: Blocking high-confidence Bandit audit
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Architecture residue audit
        run: |
          set -euo pipefail
          ! grep -RniE 'asyncpg|postgresql|DB_TYPE=postgres' backend --exclude-dir=tests
          ! grep -Rni 'allow_origins=\["\*"\]' backend/main.py
          ! grep -RniE 'self\.manager\.[A-Za-z0-9_]+\s*=' backend/services/transfer_control.py
          ! grep -RniE 's-postgres_|btn-test-postgres|PostgreSQL \(external\)|symlink-settings' frontend/static/app.js
          test ! -e backend/db/migration.py
          test ! -e backend/services/global_pause_semantics.py
          test ! -e backend/services/pause_parent_status.py
          git diff --check

      - name: Stage validated architecture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -e "$path" ]; then
              git add -- "$path"
            else
              git add -u -- "$path"
            fi
          done < .v105_changed_paths

          git rm -- tools/v105_refactor.py tools/v105_refactor_fix1.py tools/v105_refactor_fix2.py .github/workflows/v105-architecture.yml
          git diff --cached --check
          git status --short

      - name: Commit validated architecture
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Refactor DebridPulse into explicit v1.0.5 service architecture"
          final_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "short=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin HEAD:work/v1.0.5-architecture
          git push origin HEAD:staging/v1.0.5-architecture

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build local staging image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/debridpulse:${{ steps.commit.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.version }}
            VCS_REF=${{ steps.commit.outputs.sha }}
          cache-from: type=gha

      - name: Smoke test validated image
        shell: bash
        run: |
          set -euo pipefail
          container_name="debridpulse-v105-smoke"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          image_ref="local/debridpulse:${{ steps.commit.outputs.sha }}"

          docker run --detach \
            --name "$container_name" \
            --env PUID=0 \
            --env PGID=0 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/debridpulse.db \
            "$image_ref"

          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health >/dev/null; then
              healthy=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          expected_version="${{ steps.commit.outputs.version }}"
          expected_revision="${{ steps.commit.outputs.sha }}"
          image_version="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_license="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          health_version="$(docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health | jq -r '.version // empty')"

          test "$image_version" = "$expected_version"
          test "$image_revision" = "$expected_revision"
          test "$image_license" = "GPL-2.0-or-later"
          test "$health_version" = "$expected_version"
          docker exec "$container_name" test -f /app/LICENSE
          docker exec "$container_name" test -f /app/NOTICE
          docker exec "$container_name" test -f /app/licenses/python-runtime.json
          docker exec "$container_name" test -f /app/licenses/bencode2-MIT.txt
          docker exec "$container_name" grep -q "Chris Moore" /app/NOTICE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable v1.0.5 staging image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.title=DebridPulse — Multi-provider Debrid Download Manager
            org.opencontainers.image.description=Multi-provider debrid download manager for direct links, magnets, and torrent files
            org.opencontainers.image.version=${{ steps.commit.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.version }}
            VCS_REF=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
