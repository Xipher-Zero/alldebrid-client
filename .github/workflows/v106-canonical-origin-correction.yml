name: v1.0.6 Canonical Origin Correction

on:
  push:
    branches:
      - staging/v1.0.6

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging/v1.0.6
          fetch-depth: 0

      - name: Apply canonical-origin correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Restore strict browser Origin comparison. HTTPS inference comes only
          # from trusted ASGI proxy handling or the operator-owned canonical URL.
          p = Path('backend/auth/middleware.py')
          t = p.read_text()
          t = t.replace(
              'from auth.sessions import CSRF_HEADER, session_cookie_token, session_store',
              'from auth.sessions import CSRF_HEADER, request_is_secure, session_cookie_token, session_store',
              1,
          )
          old = '''    # Origin validation must use the ASGI transport scheme, not the broader\n    # secure-cookie classification. request_is_secure() may infer HTTPS from\n    # PUBLIC_BASE_URL; using that inference here can reject direct HTTP LAN login.\n    # Uvicorn rewrites scope["scheme"] when trusted proxy headers are accepted.\n    request_scheme = str(request.url.scheme or "http").casefold()\n'''
          new = '''    # Public HTTPS behind an internal HTTP reverse-proxy hop is established only\n    # from trusted ASGI proxy handling or the operator-owned canonical base URL.\n    # Direct LAN hosts do not match that canonical authority and retain their\n    # actual request scheme.\n    request_scheme = "https" if request_is_secure(request) else str(request.url.scheme or "http").casefold()\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''    # A browser-generated same-origin Fetch Metadata signal is stronger than\n    # reconstructing the public origin from server-side topology. Sec-Fetch-Site\n    # is a forbidden request header for browser JavaScript, so a cross-origin\n    # page cannot forge `same-origin`. Keep Origin syntax validation first, keep\n    # cross-site requests fail-closed, and use exact server reconstruction as the\n    # fallback for clients/browsers that omit Fetch Metadata.\n    if origin_identity is None:\n        return Response(content="Forbidden origin", status_code=403)\n\n    if fetch_site == "cross-site" and not configured_cross_origin:\n        return Response(content="Forbidden request context", status_code=403)\n\n    if fetch_site == "same-origin":\n        return await call_next(request)\n\n    if (\n        request_identity is None\n        or (origin_identity != request_identity and not configured_cross_origin)\n    ):\n        return Response(content="Forbidden origin", status_code=403)\n'''
          new = '''    if fetch_site == "cross-site" and not configured_cross_origin:\n        return Response(content="Forbidden request context", status_code=403)\n\n    if (\n        origin_identity is None\n        or request_identity is None\n        or (origin_identity != request_identity and not configured_cross_origin)\n    ):\n        return Response(content="Forbidden origin", status_code=403)\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          # Make PUBLIC_BASE_URL parsing as strict as the persisted OIDC value.
          p = Path('backend/auth/sessions.py')
          t = p.read_text()
          old = '''    if parsed.scheme.casefold() != "https":\n        return False\n    configured_authority = _authority(configured, default_scheme="https")\n'''
          new = '''    if parsed.scheme.casefold() != "https":\n        return False\n    if parsed.username is not None or parsed.password is not None:\n        return False\n    if parsed.query or parsed.fragment or parsed.path not in ("", "/"):\n        return False\n    configured_authority = _authority(configured, default_scheme="https")\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          # Surface configured/effective canonical origin and strictly validate
          # persisted UI/API values independent of whether OIDC is enabled.
          p = Path('backend/api/auth_config_routes.py')
          t = p.read_text()
          t = t.replace('import logging\nimport secrets\n', 'import logging\nimport os\nimport secrets\n', 1)
          t = t.replace(
              '    interactive_auth_enabled,\n',
              '    interactive_auth_enabled,\n    normalized_origin,\n',
              1,
          )
          anchor = '''def _authentication_mode(cfg) -> str:\n'''
          helper = '''def _valid_public_base_url(value: str) -> bool:\n    raw = str(value or "").strip()\n    if not raw:\n        return True\n    identity = normalized_origin(raw)\n    return bool(identity is not None and identity[0] == "https")\n\n\n'''
          assert anchor in t
          t = t.replace(anchor, helper + anchor, 1)
          old = '''async def _authentication_payload(request: Request) -> dict:\n    cfg = get_settings()\n    oidc_configured, callback_url = _local_oidc_state(cfg)\n    principal = getattr(request.state, "principal", Principal.anonymous())\n    return {\n'''
          new = '''async def _authentication_payload(request: Request) -> dict:\n    cfg = get_settings()\n    oidc_configured, callback_url = _local_oidc_state(cfg)\n    principal = getattr(request.state, "principal", Principal.anonymous())\n    configured_public_base = str(getattr(cfg, "public_base_url", "") or "").strip()\n    env_public_base = str(os.getenv("PUBLIC_BASE_URL", "") or "").strip()\n    effective_public_base = env_public_base or configured_public_base\n    return {\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''        "public_base_url": str(getattr(cfg, "public_base_url", "") or ""),\n        "oidc_callback_url": callback_url,\n'''
          new = '''        "public_base_url": configured_public_base,\n        "public_base_url_effective": effective_public_base,\n        "public_base_url_env_override": bool(env_public_base),\n        "oidc_callback_url": callback_url,\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''    current = get_settings()\n    candidate = _build_authentication_update(update)\n\n    if bool(getattr(candidate, "auth_password_enabled", False)) and not _prospective_password_ready(candidate, update):\n'''
          new = '''    current = get_settings()\n    candidate = _build_authentication_update(update)\n\n    if update.public_base_url is not None and not _valid_public_base_url(update.public_base_url):\n        return JSONResponse(\n            {"detail": "External Base URL must be an HTTPS origin in the form https://host[:port]"},\n            status_code=400,\n        )\n\n    if bool(getattr(candidate, "auth_password_enabled", False)) and not _prospective_password_ready(candidate, update):\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          # Validate persisted public base even when only Password auth is used.
          p = Path('backend/core/config_validator.py')
          t = p.read_text()
          old = '''    if getattr(cfg, "auth_oidc_enabled", False):\n        issuer = getattr(cfg, "oidc_issuer_url", "")\n        if issuer and not _is_valid_url(issuer, require_https=True):\n            warn("oidc_issuer_url", "OIDC issuer must use HTTPS", issuer)\n        public_base = getattr(cfg, "public_base_url", "")\n        if public_base and not _is_valid_url(public_base, require_https=True):\n            warn("public_base_url", "OIDC public base URL must use HTTPS", public_base)\n'''
          new = '''    public_base = getattr(cfg, "public_base_url", "")\n    if public_base and not _is_valid_url(public_base, require_https=True):\n        warn("public_base_url", "external base URL must use HTTPS", public_base)\n\n    if getattr(cfg, "auth_oidc_enabled", False):\n        issuer = getattr(cfg, "oidc_issuer_url", "")\n        if issuer and not _is_valid_url(issuer, require_https=True):\n            warn("oidc_issuer_url", "OIDC issuer must use HTTPS", issuer)\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          # Promote public_base_url from an OIDC-only-looking control into the
          # general Sessions & Security deployment boundary.
          p = Path('frontend/static/auth-settings.js')
          t = p.read_text()
          old = '''    const tokenConfigured = a.api_token_configured ? 'Configured' : 'Not configured';\n\n    return `<div class="stab-panel" id="tab-authentication">\n'''
          new = '''    const tokenConfigured = a.api_token_configured ? 'Configured' : 'Not configured';\n    const externalBase = a.public_base_url_env_override\n      ? (a.public_base_url_effective || '')\n      : (a.public_base_url || '');\n    const externalBaseReadonly = a.public_base_url_env_override ? 'readonly' : '';\n    const externalBaseHint = a.public_base_url_env_override\n      ? 'Effective value is supplied by the PUBLIC_BASE_URL environment variable in the deployment and overrides the persisted UI value.'\n      : 'Canonical externally reachable HTTPS origin. Used for reverse-proxy origin validation, secure cookies, and OIDC callback construction.';\n\n    return `<div class="stab-panel" id="tab-authentication">\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''          <div class="form-group"><label class="form-label">Scopes</label><input class="input" id="auth-oidc-scopes" value="${authEsc(authScopes(a.oidc_scopes))}" placeholder="openid profile email"></div>\n          <div class="form-group"><label class="form-label">Public Base URL</label><input class="input" id="auth-public-base-url" value="${authEsc(a.public_base_url || '')}" placeholder="https://debridpulse.example"></div>\n          <div class="form-group"><label class="form-label">Derived Callback URL</label><input class="input" value="${authEsc(a.oidc_callback_url || '')}" readonly></div>\n'''
          new = '''          <div class="form-group"><label class="form-label">Scopes</label><input class="input" id="auth-oidc-scopes" value="${authEsc(authScopes(a.oidc_scopes))}" placeholder="openid profile email"></div>\n          <div class="form-group"><label class="form-label">Derived Callback URL</label><input class="input" value="${authEsc(a.oidc_callback_url || 'Configure External Base URL to derive callback')}" readonly></div>\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''        <div class="scard-header">🕒 Sessions &amp; Security</div>\n        <div class="scard-body">\n          <div class="form-group"><label class="form-label">Browser Session Lifetime (hours)</label><input class="input" type="number" id="auth-session-hours" min="1" max="168" value="${Number(a.session_lifetime_hours || 12)}"></div>\n'''
          new = '''        <div class="scard-header">🕒 Sessions &amp; Security</div>\n        <div class="scard-body">\n          <div class="form-group">\n            <label class="form-label">External Base URL (Canonical Origin)</label>\n            <input class="input" id="auth-public-base-url" value="${authEsc(externalBase)}" placeholder="https://download.example.com" ${externalBaseReadonly}>\n            <div class="form-hint">${authEsc(externalBaseHint)}</div>\n          </div>\n          <div class="form-group"><label class="form-label">Browser Session Lifetime (hours)</label><input class="input" type="number" id="auth-session-hours" min="1" max="168" value="${Number(a.session_lifetime_hours || 12)}"></div>\n'''
          assert old in t
          t = t.replace(old, new, 1)
          old = '''      oidc_group_claim: value('auth-oidc-group-claim') || 'groups',\n      public_base_url: value('auth-public-base-url'),\n    };\n'''
          new = '''      oidc_group_claim: value('auth-oidc-group-claim') || 'groups',\n      public_base_url: authSettingsData?.public_base_url_env_override ? undefined : value('auth-public-base-url'),\n    };\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          # Replace topology regression tests with the actual external + LAN model.
          Path('backend/tests/test_auth_local_deployment_regressions.py').write_text('''from types import SimpleNamespace\n\nfrom fastapi import Request, Response\nimport pytest\n\nfrom api.auth_routes import _AUTH_PAGE_STYLE, _state_free_auth_page\nfrom auth.middleware import enforce_general_web_security\nfrom auth.sessions import request_is_secure\n\n\ndef _request(*, scheme="http", host="debridpulse.local:8081", origin=None, fetch_site="same-origin"):\n    headers = [(b"host", host.encode())]\n    if origin is not None:\n        headers.append((b"origin", origin.encode()))\n    if fetch_site is not None:\n        headers.append((b"sec-fetch-site", fetch_site.encode()))\n    return Request({\n        "type": "http",\n        "asgi": {"version": "3.0"},\n        "http_version": "1.1",\n        "method": "POST",\n        "scheme": scheme,\n        "path": "/login",\n        "raw_path": b"/login",\n        "query_string": b"",\n        "headers": headers,\n        "client": ("192.168.226.10", 54321),\n        "server": ("debridpulse.local", 8081),\n    })\n\n\nasync def _ok(_request):\n    return Response(content="ok", status_code=200)\n\n\n@pytest.mark.asyncio\nasync def test_external_https_origin_is_accepted_behind_http_proxy(monkeypatch):\n    monkeypatch.setenv("PUBLIC_BASE_URL", "https://download.xipherzero.com")\n    request = _request(\n        scheme="http",\n        host="download.xipherzero.com",\n        origin="https://download.xipherzero.com",\n        fetch_site="same-origin",\n    )\n    assert request_is_secure(request) is True\n    assert (await enforce_general_web_security(request, _ok)).status_code == 200\n\n\n@pytest.mark.asyncio\nasync def test_direct_lan_http_remains_same_origin_with_external_base_configured(monkeypatch):\n    monkeypatch.setenv("PUBLIC_BASE_URL", "https://download.xipherzero.com")\n    request = _request(\n        scheme="http",\n        host="192.168.226.200:8081",\n        origin="http://192.168.226.200:8081",\n        fetch_site="same-origin",\n    )\n    assert request_is_secure(request) is False\n    assert (await enforce_general_web_security(request, _ok)).status_code == 200\n\n\n@pytest.mark.asyncio\nasync def test_same_origin_fetch_metadata_does_not_bypass_origin_mismatch(monkeypatch):\n    monkeypatch.setenv("PUBLIC_BASE_URL", "https://download.xipherzero.com")\n    request = _request(\n        scheme="http",\n        host="internal.example:8080",\n        origin="https://different.example",\n        fetch_site="same-origin",\n    )\n    assert (await enforce_general_web_security(request, _ok)).status_code == 403\n\n\n@pytest.mark.asyncio\nasync def test_cross_site_login_mutation_is_still_rejected(monkeypatch):\n    monkeypatch.setenv("PUBLIC_BASE_URL", "https://download.xipherzero.com")\n    request = _request(\n        host="download.xipherzero.com",\n        origin="https://evil.example",\n        fetch_site="cross-site",\n    )\n    assert (await enforce_general_web_security(request, _ok)).status_code == 403\n\n\ndef test_invalid_public_base_path_is_not_trusted_for_secure_classification(monkeypatch):\n    monkeypatch.setenv("PUBLIC_BASE_URL", "https://download.xipherzero.com/not-an-origin")\n    request = _request(host="download.xipherzero.com")\n    assert request_is_secure(request) is False\n\n\ndef test_auth_pages_use_debridpulse_dark_theme_palette():\n    assert "--bg:#090812" in _AUTH_PAGE_STYLE\n    assert "--accent:#a67cff" in _AUTH_PAGE_STYLE\n    assert "#f08a24" not in _AUTH_PAGE_STYLE\n    response = _state_free_auth_page(message="Try again shortly.", status_code=429, retry_after=60)\n    assert 'class="card"' in response.body.decode()\n    assert "style-src 'unsafe-inline'" in response.headers["Content-Security-Policy"]\n\n\ndef test_auth_settings_present_external_base_as_general_security_setting():\n    source = (Path(__file__).resolve().parents[2] / "frontend" / "static" / "auth-settings.js").read_text()\n    assert "External Base URL (Canonical Origin)" in source\n    assert "reverse-proxy origin validation" in source\n    assert "PUBLIC_BASE_URL environment variable" in source\n'''.replace('from types import SimpleNamespace\n\n', 'from pathlib import Path\n\n'))

          # Correct the environment example: this is a security/deployment value,
          # not merely a Discord-avatar helper.
          Path('.env.example').write_text('''# DebridPulse — environment variables\n\n# Timezone\nTZ=Etc/UTC\n\n# Optional canonical externally reachable HTTPS origin.\n# Recommended when DebridPulse is exposed through a reverse proxy.\n# Used for browser origin validation, secure-cookie classification, and OIDC callbacks.\n# This environment value overrides the persisted Authentication-menu value.\n# PUBLIC_BASE_URL=https://download.example.com\n''')

          # Expand docs without renaming the persistent compatibility key.
          p = Path('docs/authentication.md')
          t = p.read_text()
          anchor = '''## Username & Password\n'''
          section = '''## External access and canonical origin\n\nWhen DebridPulse is exposed through an HTTPS reverse proxy, configure the exact externally reachable origin even if only Username & Password authentication is enabled. The same canonical origin is used for browser mutation-origin validation, HTTPS-only cookie classification, and OIDC callback construction.\n\nThe recommended deployment-level setting is:\n\n```yaml\nenvironment:\n  PUBLIC_BASE_URL: https://download.example.com\n```\n\nThe equivalent persisted setting is available under **Settings → Authentication → Sessions & Security → External Base URL (Canonical Origin)**. `PUBLIC_BASE_URL` takes precedence when both are present; the UI displays the effective environment override as read-only.\n\nUse only an HTTPS origin in `scheme://host[:port]` form, with no path, query, fragment, or credentials. Configuring an external base does not disable direct LAN access: a direct LAN request continues to be evaluated against its own Host/scheme, while a request whose Host matches the configured external authority can be recognized as the canonical HTTPS origin across an internal HTTP reverse-proxy hop.\n\n`CORS_ORIGINS` is not a substitute for the canonical origin. CORS controls intentionally permitted cross-origin API callers; the External Base URL describes DebridPulse's own externally reachable browser origin.\n\n'''
          assert anchor in t
          t = t.replace(anchor, section + anchor, 1)
          t = t.replace('For OIDC deployments, terminate HTTPS at the public ingress and set **Public Base URL** to the canonical external origin.', 'For externally proxied deployments, terminate HTTPS at the public ingress and set **External Base URL (Canonical Origin)** to the canonical external origin.')
          p.write_text(t)
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Validate
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/test_auth_local_deployment_regressions.py -v --tb=short
          python -m pytest tests/ -v --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit correction and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v106-canonical-origin-correction.yml
          git add \
            backend/auth/middleware.py \
            backend/auth/sessions.py \
            backend/api/auth_config_routes.py \
            backend/core/config_validator.py \
            backend/tests/test_auth_local_deployment_regressions.py \
            frontend/static/auth-settings.js \
            docs/authentication.md \
            .env.example
          git diff --cached --check
          git commit -m 'Make external base URL the canonical browser origin'
          git push origin HEAD:staging/v1.0.6
