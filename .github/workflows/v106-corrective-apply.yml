name: v1.0.6 corrective apply

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup

permissions:
  contents: write
  security-events: write
  actions: read

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply audited corrective patch
        run: |
          python tools/v106_corrective_patch.py
          python tools/v106_corrective_postpatch.py

      - name: Vendor pinned Chart.js 4.4.1
        run: |
          mkdir -p frontend/static/vendor
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js \
            --output frontend/static/vendor/chart.umd.min.js
          echo 'd2af8974e95271638772e9e9524db5b9a6f58d6ec2d5d781400447b4a31c681e  frontend/static/vendor/chart.umd.min.js' | sha256sum -c -

      - name: Initialize CodeQL over corrected tree
        uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript,actions
          build-mode: none
          queries: security-and-quality

      - name: Install test and audit dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Static correctness checks
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js
          git diff --check

      - name: Full test suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Dependency and Python security audit
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Perform CodeQL analysis on corrected tree
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:v106-corrective

      - name: Verify corrective contracts before commit
        run: |
          test ! -e frontend/static/vendor/chart.umd.min.js.tmp
          ! grep -R 'cdnjs.cloudflare.com/ajax/libs/Chart.js' frontend/static
          grep -q 'javascript-typescript' .github/workflows/codeql.yml
          grep -q 'release_database_wipe_quiescence' backend/api/routes.py
          grep -q 'clear_secrets' frontend/static/app.js
          grep -q '_provider_delete_authorized' backend/services/manager_v2.py

      - name: Commit validated corrective candidate
        run: |
          rm -f tools/v106_corrective_patch.py tools/v106_corrective_postpatch.py .github/workflows/v106-corrective-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close v1.0.6 audit blockers'
          git push origin HEAD:work/v1.0.6-audit-cleanup
