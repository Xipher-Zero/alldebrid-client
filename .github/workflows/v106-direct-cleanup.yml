name: Apply v1.0.6 Audit Cleanup

# Second push intentionally triggers this one-shot workflow after it exists on the branch.
on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply asserted cleanup
        run: python tools/v106_direct_cleanup.py

      - name: Install validation tools
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Undefined-name lint
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Full test suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Syntax validation
        run: |
          cd backend
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Dependency audit
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: High-confidence security lint
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

      - name: Diff sanity
        run: |
          git diff --check
          git status --short

      - name: Container build and health smoke
        shell: bash
        run: |
          set -euo pipefail
          docker build -t debridpulse:v106-audit-cleanup .
          docker run -d --rm --name debridpulse-v106-audit-smoke -p 18081:8080 debridpulse:v106-audit-cleanup
          trap 'docker rm -f debridpulse-v106-audit-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/api/health >/tmp/debridpulse-health.json; then
              cat /tmp/debridpulse-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs debridpulse-v106-audit-smoke
          exit 1

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/v106_direct_cleanup.py .github/workflows/v106-direct-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete v1.0.6 audit cleanup and unify dashboard input"
          git push origin HEAD:work/v1.0.6-audit-cleanup
