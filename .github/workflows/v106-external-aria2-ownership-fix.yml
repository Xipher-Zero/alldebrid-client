name: v1.0.6 external aria2 ownership fix

on:
  push:
    branches: [work/v1.0.6-audit-cleanup]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup

      - name: Apply narrow ownership correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/transfer_control.py')
          source = path.read_text()

          helper = '''    async def _require_owned_mutation(self, gid: str) -> str:\n        normalized = str(gid or "").strip()\n        if not normalized:\n            raise ValueError("aria2 GID is required")\n        if not is_builtin_mode() and normalized not in await self.manager._aria2_owned_gids():\n            raise PermissionError(f"aria2 GID {normalized} is not owned by DebridPulse")\n        return normalized\n\n'''

          pause_old = '''    async def _strict_pause_gid(self, gid: str):\n        state = await self.confirm_gid(gid)\n'''
          pause_new = helper + '''    async def _strict_pause_gid(self, gid: str):\n        gid = await self._require_owned_mutation(gid)\n        state = await self.confirm_gid(gid)\n'''

          resume_old = '''    async def _strict_resume_gid(self, gid: str):\n        state = await self.confirm_gid(gid)\n'''
          resume_new = '''    async def _strict_resume_gid(self, gid: str):\n        gid = await self._require_owned_mutation(gid)\n        state = await self.confirm_gid(gid)\n'''

          if 'async def _require_owned_mutation' not in source:
              if source.count(pause_old) != 1:
                  raise SystemExit('expected exactly one strict pause insertion point')
              source = source.replace(pause_old, pause_new, 1)
          elif 'gid = await self._require_owned_mutation(gid)' not in source.split('async def _strict_pause_gid', 1)[1].split('async def _strict_resume_gid', 1)[0]:
              raise SystemExit('ownership helper exists but strict pause is not guarded')

          resume_block = source.split('async def _strict_resume_gid', 1)[1].split('    async def _owned', 1)[0]
          if 'gid = await self._require_owned_mutation(gid)' not in resume_block:
              if source.count(resume_old) != 1:
                  raise SystemExit('expected exactly one strict resume insertion point')
              source = source.replace(resume_old, resume_new, 1)

          path.write_text(source)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Validate correction
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m pytest tests/ -v --tb=short
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Commit corrected source
        run: |
          if git diff --quiet -- backend/services/transfer_control.py; then
            echo 'Source already corrected; nothing to commit.'
            exit 0
          fi
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add -- backend/services/transfer_control.py
          git commit -m 'Enforce external aria2 ownership in transfer control'
          git push origin HEAD:work/v1.0.6-audit-cleanup
