# Temporary corrective workflow; removed after the source pass is validated.
name: v1.0.6 Final Audit Corrective Pass

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup
    paths:
      - tools/v106_final_audit_patch.py
      - .github/workflows/v106-final-audit-corrective.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Apply corrective pass
        run: python tools/v106_final_audit_patch.py

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Focused final-audit regressions
        run: |
          cd backend
          python -m pytest tests/test_v106_final_audit.py -v --tb=short

      - name: Static validation
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/api/serializers.py \
            backend/api/routes.py \
            backend/core/branding.py \
            backend/core/config.py \
            backend/core/scheduler.py \
            backend/db/database.py \
            backend/services/aria2.py \
            backend/services/aria2_runtime.py \
            backend/services/backup.py \
            backend/services/db_maintenance.py \
            backend/services/maintenance_gate.py \
            backend/services/manager_v2.py \
            backend/services/provider_gateway.py \
            backend/services/stats.py \
            backend/services/transfer_service.py \
            frontend/static/app.js \
            NOTICE \
            .github/workflows/fork-image.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Corrective helper produced no source changes"
            exit 1
          fi
          git commit -m "Fix final v1.0.6 audit findings"
          git push origin HEAD:work/v1.0.6-audit-cleanup
