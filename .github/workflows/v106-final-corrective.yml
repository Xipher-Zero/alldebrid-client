name: v1.0.6 final corrective

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Apply narrow corrective pass
        run: python tools/v106_final_corrective_pass.py

      - name: Verify patch shape
        run: |
          git diff --check
          git status --short

      - name: Run focused audit regressions
        run: |
          cd backend
          python -m pytest \
            tests/test_v106_final_corrective_pass.py \
            tests/test_v106_final_audit.py \
            tests/test_v106_audit_contracts.py \
            tests/test_v106_corrective_regressions.py \
            -v --tb=short

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Run full test suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python and frontend syntax
        run: |
          cd backend
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Commit validated corrective source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Dockerfile \
            backend/main.py \
            backend/api/routes.py \
            backend/services/aria2.py \
            backend/services/manager_v2.py \
            backend/services/provider_gateway.py \
            backend/services/transfer_service.py \
            backend/tests/test_v106_final_corrective_pass.py
          if git diff --cached --quiet; then
            echo "No corrective source changes to commit"
            exit 0
          fi
          git commit -m "Close final v1.0.6 audit gaps"
          git push origin HEAD:work/v1.0.6-audit-cleanup
