name: v1.0.6 Final Log Redaction

on:
  push:
    branches: [work/v1.0.6-audit-cleanup]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Remove capability URL from missing-GID recovery log
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/services/manager_v2.py")
          text = path.read_text(encoding="utf-8")

          old_message = '"sync_aria2: aria2 entry not found for torrent %s file %s (path=%s, url=%s) -> scheduling reset",'
          new_message = '"sync_aria2: aria2 entry not found for torrent %s file %s (path=%s) -> scheduling reset",'
          old_args = 'row["torrent_id"], row["file_id"], remote_path or "-", url or "-",'
          new_args = 'row["torrent_id"], row["file_id"], remote_path or "-",'

          message_count = text.count(old_message)
          args_count = text.count(old_args)
          if message_count != 1 or args_count != 1:
              if new_message in text and new_args in text:
                  print("Missing-GID recovery log already capability-safe")
              else:
                  raise RuntimeError(
                      f"unexpected manager_v2 shape: message={message_count}, args={args_count}"
                  )
          else:
              text = text.replace(old_message, new_message, 1)
              text = text.replace(old_args, new_args, 1)
              path.write_text(text, encoding="utf-8")
              print("Removed download capability URL from missing-GID recovery log")
          PY

      - name: Run focused corrective regression
        run: |
          cd backend
          python -m pytest tests/test_v106_final_corrective_pass.py -v --tb=short

      - name: Run full test suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823

      - name: Check Python and frontend syntax
        run: |
          cd backend
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Commit validated source correction
        run: |
          if git diff --quiet -- backend/services/manager_v2.py; then
            echo "No source correction required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/services/manager_v2.py
          git commit -m "Redact capability URL from aria2 recovery log"
          git push origin HEAD:work/v1.0.6-audit-cleanup
