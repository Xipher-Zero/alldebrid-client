name: Apply v1.0.6 Header Action Alignment Fix

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply guarded header action alignment fix
        run: python tools/v106_fix_header_actions.py

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Validate fix
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js
          git diff --check

      - name: Commit validated fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v106_fix_header_actions.py .github/workflows/v106-header-actions-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep unified submission actions right-aligned"
          git push origin HEAD:work/v1.0.6-audit-cleanup
