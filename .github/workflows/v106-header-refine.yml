name: Apply v1.0.6 Header Refinement

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v5
        with:
          ref: work/v1.0.6-audit-cleanup
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply asserted UI refinement
        run: python tools/v106_header_help.py

      - name: Diff sanity
        run: git diff --check

      - name: Remove temporary refinement machinery
        run: |
          rm -f tools/v106_header_help.py
          rm -f .github/workflows/v106-header-refine.yml
          rm -f v106-header-refine-trigger.txt

      - name: Commit refined candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine unified submission helper placement"
          git push origin HEAD:work/v1.0.6-audit-cleanup
