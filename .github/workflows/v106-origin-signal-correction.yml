name: v1.0.6 Browser Origin Signal Correction

on:
  push:
    branches:
      - staging/v1.0.6

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging/v1.0.6
          fetch-depth: 0

      - name: Apply correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/auth/middleware.py')
          t = p.read_text()
          old = '''    if fetch_site == "cross-site" and not configured_cross_origin:\n        return Response(content="Forbidden request context", status_code=403)\n\n    if (\n        origin_identity is None\n        or request_identity is None\n        or (origin_identity != request_identity and not configured_cross_origin)\n    ):\n        return Response(content="Forbidden origin", status_code=403)\n\n    return await call_next(request)\n'''
          new = '''    # A browser-generated same-origin Fetch Metadata signal is stronger than\n    # reconstructing the public origin from server-side topology. Sec-Fetch-Site\n    # is a forbidden request header for browser JavaScript, so a cross-origin\n    # page cannot forge `same-origin`. Keep Origin syntax validation first, keep\n    # cross-site requests fail-closed, and use exact server reconstruction as the\n    # fallback for clients/browsers that omit Fetch Metadata.\n    if origin_identity is None:\n        return Response(content="Forbidden origin", status_code=403)\n\n    if fetch_site == "cross-site" and not configured_cross_origin:\n        return Response(content="Forbidden request context", status_code=403)\n\n    if fetch_site == "same-origin":\n        return await call_next(request)\n\n    if (\n        request_identity is None\n        or (origin_identity != request_identity and not configured_cross_origin)\n    ):\n        return Response(content="Forbidden origin", status_code=403)\n\n    return await call_next(request)\n'''
          assert old in t
          p.write_text(t.replace(old, new, 1))

          p = Path('backend/tests/test_auth_local_deployment_regressions.py')
          t = p.read_text()
          addition = '''\n\n@pytest.mark.asyncio\nasync def test_same_origin_fetch_metadata_survives_server_origin_reconstruction_mismatch():\n    request = _request(\n        scheme="https",\n        host="container-internal:8080",\n        origin="http://192.168.226.200:8081",\n        fetch_site="same-origin",\n    )\n    assert (await enforce_general_web_security(request, _ok)).status_code == 200\n\n\n@pytest.mark.asyncio\nasync def test_same_site_different_origin_does_not_bypass_exact_origin_check():\n    request = _request(\n        scheme="http",\n        host="debridpulse.local:8081",\n        origin="http://other.debridpulse.local:8081",\n        fetch_site="same-site",\n    )\n    assert (await enforce_general_web_security(request, _ok)).status_code == 403\n\n\n@pytest.mark.asyncio\nasync def test_malformed_origin_is_rejected_even_with_same_origin_fetch_metadata():\n    request = _request(origin="null", fetch_site="same-origin")\n    assert (await enforce_general_web_security(request, _ok)).status_code == 403\n'''
          assert 'test_same_origin_fetch_metadata_survives_server_origin_reconstruction_mismatch' not in t
          p.write_text(t + addition)
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Validate
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/test_auth_local_deployment_regressions.py -v --tb=short
          python -m pytest tests/ -v --tb=short
          python -m compileall -q .
          pip-audit -r requirements.txt --progress-spinner off
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
          cd ..
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js

      - name: Commit correction and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v106-origin-signal-correction.yml
          git add backend/auth/middleware.py backend/tests/test_auth_local_deployment_regressions.py
          git diff --cached --check
          git commit -m 'Use browser same-origin signal for auth mutations'
          git push origin HEAD:staging/v1.0.6
