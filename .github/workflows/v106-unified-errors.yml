name: v1.0.6 Unified Error Fix

on:
  push:
    branches:
      - work/v1.0.6-audit-cleanup

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v106-error-fix-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Apply guarded correction
        run: python .github/v106-fix-unified-errors.py

      - name: Validate correction
        run: |
          cd backend
          ruff check api core db services main.py --select F821,F822,F823
          python -m pytest tests/ -q
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js
          git diff --check

      - name: Commit clean source correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/v106-fix-unified-errors.py
          rm -f .github/workflows/v106-unified-errors.yml
          rm -f v106-unified-error-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Restore unified submission error feedback [v106-error-fix-done]'
          git push origin HEAD:work/v1.0.6-audit-cleanup
