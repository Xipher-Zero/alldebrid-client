# DebridPulse — Multi-provider Debrid Download Manager
#
# Operating modes:
#
#   1. SQLite (default — no setup needed):
#      docker compose up -d

services:

  debridpulse:
    image: ghcr.io/xipher-zero/debridpulse:v1.0.6
    build: .
    container_name: debridpulse
    restart: unless-stopped
    # host mode: avoids custom bridge networks that conflict with Unraid shfs
    network_mode: host
    volumes:
      - /mnt/user/appdata/debridpulse/data:/app/data
      - /mnt/user/appdata/debridpulse/config:/app/config
      - /mnt/user/downloads:/download
    environment:
      # File ownership for downloaded files — set to match your host user
      # so that other host processes can read and write the files.
      # Run `id` on the host to find your UID and GID.
      - PUID=99
      - PGID=100
      - CONFIG_PATH=/app/config/config.json
      - DB_PATH=/app/data/debridpulse.db
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
